<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小信号 · 见室</title>
  <meta name="description" content="一些金句 一些思考 一些优质信息源">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="小信号" href="./rss.xml">
  <style>
    main { max-width: 640px; padding-top: 34px; }

    .home-hero { padding: 12px 0 30px; border-bottom: 1px solid var(--border); margin-bottom: 34px; }
    .home-hero h1 {
      font-family: var(--serif); font-size: 27px; font-weight: 700;
      letter-spacing: 3px; color: var(--text-primary); margin: 0 0 10px;
    }
    .home-hero .home-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 18px; }
    .home-hero p.home-desc {
      font-size: 15px; line-height: 1.9; color: var(--text-secondary); margin: 0;
    }
    .home-hero p.home-desc a { color: var(--text-primary); border-bottom: 1px solid var(--border); }
    .home-hero p.home-desc a:hover { border-bottom-color: var(--text-secondary); }

    .home-sec { margin-bottom: 38px; }
    .home-sec-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin-bottom: 4px;
    }
    .home-sec-head h2 {
      font-size: 12px; font-weight: 600; letter-spacing: .18em;
      color: var(--text-muted); margin: 0;
    }
    .home-sec-head a { font-size: 12px; color: var(--text-muted); }
    .home-sec-head a:hover { color: var(--text-primary); }

    .home-list { list-style: none; margin: 0; padding: 0; }
    .home-list li { border-bottom: 1px solid var(--border); }
    .home-list li:last-child { border-bottom: none; }
    .home-row {
      display: flex; align-items: baseline; gap: 14px;
      padding: 13px 0; text-decoration: none; color: inherit;
    }
    .home-row .home-row-title {
      flex: 1 1 auto; min-width: 0; font-size: 15px; line-height: 1.6;
      color: var(--text-primary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .home-row:hover .home-row-title { color: var(--accent); }
    .home-row .home-row-date {
      flex: 0 0 auto; font-size: 12px; color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .home-quote-body {
      font-family: var(--serif); font-size: 16px; line-height: 1.95;
      color: var(--text-primary); margin: 0 0 8px; white-space: pre-wrap;
    }
    .home-quote-meta { font-size: 12px; color: var(--text-muted); }
    .home-mute { font-size: 13px; color: var(--text-muted); margin: 0; padding: 13px 0; }
    .home-think { font-size: 14px; line-height: 1.85; color: var(--text-secondary); margin: 0 0 6px; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="./" class="logo">小信号<span>.</span></a>
      <nav>
        <a href="./" class="active">主页</a>
        <a href="./writing.html">写作</a>
        <a href="./thoughts.html">想法</a>
        <a href="./reading.html">阅览</a>
        <a href="./quotes.html">见室引号</a>
        <a href="./archive.html">归档</a>
        <a href="./about.html">关于</a>
      </nav>
      <div class="controls">
        <a href="./search.html" class="btn-icon" title="搜索">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </a>
        <button class="btn-icon" id="themeBtn" title="切换主题">
          <svg id="sunIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg id="moonIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button class="menu-btn" id="menuBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <button class="mobile-nav-close" id="mobileNavClose">&times;</button>
    <a href="./" class="active">主页</a>
    <a href="./writing.html">写作</a>
    <a href="./thoughts.html">想法</a>
    <a href="./reading.html">阅览</a>
    <a href="./quotes.html">见室引号</a>
    <a href="./archive.html">归档</a>
    <a href="./about.html">关于</a>
  </div>

  <main>
    <div class="home-hero">
      <h1>小信号</h1>
      <p class="home-sub">一些金句 一些思考 一些优质信息源</p>
      <p class="home-desc">
        这里是见室的个人站点。读到的句子放进<a href="./quotes.html">见室引号</a>，
        想清楚的事写成<a href="./writing.html">文章</a>，
        正在读的书留在<a href="./reading.html">阅览</a>。
        内容由 Notion 与微信读书自动同步，也可以<a href="./rss.xml">订阅 RSS</a>。
      </p>
    </div>

    <section class="home-sec">
      <div class="home-sec-head">
        <h2>最近写作</h2>
        <a href="./writing.html">全部 →</a>
      </div>
      <ul class="home-list" id="homeWriting">
        <li><p class="home-mute">加载中…</p></li>
      </ul>
    </section>

    <section class="home-sec">
      <div class="home-sec-head">
        <h2>最近想法</h2>
        <a href="./thoughts.html">全部 →</a>
      </div>
      <ul class="home-list" id="homeThoughts">
        <li><p class="home-mute">加载中…</p></li>
      </ul>
    </section>

    <section class="home-sec" id="quoteSec">
      <div class="home-sec-head">
        <h2>随手一句</h2>
        <a href="./quotes.html" id="quoteRefresh">换一条 ↻</a>
      </div>
      <div id="homeQuote"><p class="home-mute">加载中…</p></div>
    </section>
  </main>

  <footer>
    <p>小信号 · <a href="https://github.com/daheitian/seesquotes" target="_blank" rel="noopener">GitHub</a> · 由 Notion 与微信读书驱动 · <a href="./rss.xml">RSS 订阅</a></p>
  </footer>

  <script src="./assets/js/main.js"></script>
  <script>
    const { escapeHtml, formatDate, loadJSON } = window.siteUtils;
    const REPO = 'daheitian/seesquotes';

    const ymd = (iso) => {
      const d = new Date(iso);
      if (isNaN(d)) return '';
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    };

    async function loadWriting() {
      const box = document.getElementById('homeWriting');
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/issues?state=all&per_page=100`, {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const issues = (await res.json()).filter(i => !i.pull_request).slice(0, 6);
        box.innerHTML = issues.length
          ? issues.map(i => `
          <li><a class="home-row" href="./writing.html#post-${i.number}">
            <span class="home-row-title">${escapeHtml(i.title)}</span>
            <span class="home-row-date">${ymd(i.created_at)}</span>
          </a></li>`).join('')
          : '<li><p class="home-mute">还没有文章</p></li>';
      } catch (e) {
        box.innerHTML = '<li><p class="home-mute"><a href="./writing.html">前往写作页 →</a></p></li>';
      }
    }

    async function loadThoughts() {
      const box = document.getElementById('homeThoughts');
      try {
        const data = await loadJSON('./_data/thoughts.json');
        const posts = (data.posts || data).slice(0, 3);
        box.innerHTML = posts.length
          ? posts.map(p => `
          <li style="padding:13px 0;">
            <p class="home-think">${escapeHtml(p.content || p.title || '')}</p>
            <span style="font-size:12px;color:var(--text-muted);">${ymd(p.date)}</span>
          </li>`).join('')
          : '<li><p class="home-mute">还没有想法</p></li>';
      } catch (e) {
        box.innerHTML = '<li><p class="home-mute"><a href="./thoughts.html">前往想法页 →</a></p></li>';
      }
    }

    let quotes = [];
    function renderQuote() {
      const box = document.getElementById('homeQuote');
      if (!quotes.length) { box.innerHTML = '<p class="home-mute">暂无</p>'; return; }
      const q = quotes[Math.floor(Math.random() * quotes.length)];
      box.innerHTML = `
        <p class="home-quote-body">${escapeHtml((q.content || q.title || '').slice(0, 220))}</p>
        <div class="home-quote-meta">${formatDate(q.date || q.pubDate)}</div>`;
    }
    async function loadQuotes() {
      try {
        const data = await loadJSON('./notion-data.json');
        quotes = data.posts || data;
        renderQuote();
      } catch (e) {
        document.getElementById('homeQuote').innerHTML =
          '<p class="home-mute"><a href="./quotes.html">前往见室引号 →</a></p>';
      }
    }
    document.getElementById('quoteRefresh').addEventListener('click', (e) => {
      if (quotes.length) { e.preventDefault(); renderQuote(); }
    });

    loadWriting();
    loadThoughts();
    loadQuotes();
  </script>
</body>
</html>
