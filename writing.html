<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写作 | 小信号</title>
  <meta name="description" content="更长形式的思考与文章，基于 GitHub Issues">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="小信号" href="./rss.xml">
  <style>
    /* ===== 站内文章阅读视图 ===== */
    .article-view { display: none; }
    .article-view.active { display: block; }
    .list-view.hidden { display: none; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      margin-bottom: 20px;
      background: none;
      border: none;
      padding: 0;
      font-family: var(--sans);
    }
    .back-link:hover { color: var(--accent); }

    .article {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 40px 40px;
    }

    .article-title {
      font-family: var(--serif);
      font-size: 27px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    /* 编号目录（参考 doc.niallspace.com 的文章页） */
    /* 列表条目：标题用衬线，更像文章索引 */
    .issues-list .issue-title { font-family: var(--serif); font-size: 17px; line-height: 1.6; }

    /* ---------- 工具栏：与头部一致的克制描边风格 ---------- */
    .wr-toolbar {
      display: flex; align-items: center; gap: 14px;
      justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px;
    }
    .wr-toolbar .filter-tabs { margin-bottom: 0; flex: 1 1 auto; min-width: 0; }
    /* 覆盖全站胶囊样式，改为扁平（与全站直角风格一致） */
    .wr-toolbar .filter-tab { border-radius: 0; padding: 6px 14px; font-size: 13px; background: transparent; }
    .wr-toolbar .filter-tab:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .wr-toolbar .filter-tab.active {
      background: var(--text-primary); color: var(--bg-primary); border-color: var(--text-primary);
    }
    .wr-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .wr-select {
      padding: 7px 12px; background: transparent; border: 1px solid var(--border);
      color: var(--text-secondary); font-size: 13px; border-radius: 0; cursor: pointer; outline: none;
      font-family: var(--sans);
    }
    .wr-select:hover { color: var(--text-primary); border-color: var(--text-secondary); }
    .wr-select option { background: var(--bg-card); color: var(--text-primary); }
    .wr-write {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 15px;
      border: 1px solid var(--border); color: var(--text-secondary); font-size: 13px;
      text-decoration: none; border-radius: 0; white-space: nowrap; transition: all .2s ease;
    }
    .wr-write:hover { color: var(--text-primary); border-color: var(--text-secondary); background: var(--bg-card-hover); }
    @media (max-width: 600px) {
      .wr-actions { width: 100%; margin-left: 0; }
      .wr-toolbar .filter-tabs { width: 100%; }
    }

    .article-toc {
      margin: 26px 0 34px;
      padding: 16px 20px 18px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .article-toc-title {
      font-size: 11px;
      letter-spacing: .2em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .article-toc ol { counter-reset: toc; list-style: none; margin: 0; padding: 0; }
    .article-toc li {
      counter-increment: toc;
      font-size: 14px;
      line-height: 2;
      color: var(--text-secondary);
    }
    .article-toc li::before { content: counter(toc) ". "; color: var(--text-muted); }
    .article-toc a { color: var(--text-secondary); text-decoration: none; }
    .article-toc a:hover { color: var(--text-primary); text-decoration: underline; }
    .article-body h2, .article-body h3, .article-body h1 { scroll-margin-top: 90px; }

    .article-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
      padding-bottom: 18px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    /* Markdown 正文排版 */
    .article-body {
      font-size: 16px;
      line-height: 1.9;
      color: var(--text-primary);
      word-wrap: break-word;
    }
    .article-body h1, .article-body h2, .article-body h3,
    .article-body h4, .article-body h5, .article-body h6 {
      font-family: var(--serif);
      margin: 28px 0 12px;
      line-height: 1.5;
      color: var(--text-primary);
    }
    .article-body h1 { font-size: 22px; }
    .article-body h2 { font-size: 20px; }
    .article-body h3 { font-size: 18px; }
    .article-body h4, .article-body h5, .article-body h6 { font-size: 16px; }
    .article-body p { margin-bottom: 14px; }
    .article-body a { color: var(--accent); }
    .article-body a:hover { text-decoration: underline; }
    .article-body img {
      max-width: 100%;
      border-radius: var(--radius-sm);
      margin: 10px 0;
    }
    .article-body blockquote {
      border-left: 3px solid var(--accent);
      padding: 4px 0 4px 16px;
      margin: 16px 0;
      color: var(--text-secondary);
    }
    .article-body blockquote p { margin: 6px 0; }
    .article-body ul, .article-body ol {
      margin: 12px 0;
      padding-left: 24px;
    }
    .article-body li { margin-bottom: 6px; }
    .article-body code {
      background: var(--bg-card-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 13.5px;
      font-family: ui-monospace, Consolas, monospace;
      color: var(--accent);
    }
    .article-body pre {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      overflow-x: auto;
      margin: 16px 0;
    }
    .article-body pre code {
      background: none;
      border: none;
      padding: 0;
      color: var(--text-primary);
      font-size: 13.5px;
      line-height: 1.7;
    }
    .article-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }
    .article-body strong { color: var(--text-primary); }

    /* 评论 */
    .comments-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .comments-title {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .comment-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .comment-item:last-child { border-bottom: none; }
    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .comment-body { flex: 1; min-width: 0; }
    .comment-author {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .comment-time { font-size: 12px; color: var(--text-muted); margin-left: 8px; }
    .comment-content {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-top: 4px;
    }

    @media (max-width: 640px) {
      .article { padding: 20px; }
      .article-title { font-size: 20px; }
    }

    /* ===== 全直角覆盖（写作页统一去弧角） ===== */
    .list-view .toolbar select,
    .list-view .btn-primary,
    .list-view .issue-label,
    .article-view .toolbar select,
    .article-view .btn-primary,
    .article-view .issue-label { border-radius: 2px; }

    .article-view .article,
    .article-view .article-body pre,
    .article-view .article-body code,
    .article-view .article-body pre code,
    .article-view .comment-avatar,
    .article-view .comment-content code,
    .article-view .comment-content pre { border-radius: 2px; }
    /* ================================================================
       Bear Blog 风格层（参考 pens.me）
       要点：单栏 640px、去掉卡片盒子、细分隔线、元信息克制
       ================================================================ */
    main { max-width: 640px; padding-top: 30px; }

    /* 页头：左对齐、更收敛 */
    .page-header { text-align: left; padding: 16px 0 24px; }
    .page-header h1 { font-size: 23px; letter-spacing: 2px; margin-bottom: 7px; }
    .page-header p { margin: 0; max-width: none; font-size: 13px; color: var(--text-muted); }

    /* 工具栏：无底色，一条细线分隔 */
    .wr-toolbar {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      background: none; border: none; border-bottom: 1px solid var(--border);
      border-radius: 0; padding: 0 0 12px; margin: 0 0 2px;
    }
    .wr-toolbar .filter-tabs { flex: 1 1 auto; min-width: 0; }
    .wr-toolbar .filter-tab {
      background: none; border: none; border-radius: 0;
      padding: 2px 0; margin-right: 15px;
      font-size: 13px; color: var(--text-muted);
      transition: color .15s ease;
    }
    .wr-toolbar .filter-tab:hover { color: var(--text-secondary); background: none; border: none; }
    .wr-toolbar .filter-tab.active {
      background: none; color: var(--text-primary);
      border: none; box-shadow: inset 0 -1px 0 var(--text-secondary);
    }
    .wr-actions { gap: 12px; }
    .wr-select {
      border: none; border-bottom: 1px solid transparent; border-radius: 0;
      background: none; padding: 2px 0; font-size: 13px; color: var(--text-muted);
    }
    .wr-select:hover { border-bottom-color: var(--border); background: none; color: var(--text-primary); }
    .wr-write {
      border: none; border-bottom: 1px solid var(--border); border-radius: 0;
      background: none; padding: 2px 0; font-size: 13px; color: var(--text-muted);
    }
    .wr-write:hover { color: var(--text-primary); border-bottom-color: var(--text-secondary); background: none; }

    /* 列表：行式 + 细分隔线，无卡片 */
    .issues-list { display: block; }
    .issue-item {
      display: block; background: none; border: none; border-radius: 0;
      border-bottom: 1px solid var(--border);
      padding: 20px 0; text-decoration: none;
      transition: opacity .15s ease;
    }
    .issue-item:last-child { border-bottom: none; }
    .issue-head { display: flex; align-items: baseline; gap: 16px; }
    .issues-list .issue-title {
      flex: 1 1 auto; min-width: 0;
      font-family: var(--serif); font-size: 17px; font-weight: 600;
      line-height: 1.55; color: var(--text-primary);
      transition: color .15s ease;
    }
    .issue-item:hover .issue-title { color: var(--accent); }
    .issue-date {
      flex: 0 0 auto; font-size: 12px; color: var(--text-muted);
      font-variant-numeric: tabular-nums; letter-spacing: .02em;
    }
    .issue-excerpt {
      margin: 7px 0 0; font-size: 14px; line-height: 1.75;
      color: var(--text-secondary);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .issue-meta {
      margin-top: 9px; font-size: 12px; color: var(--text-muted);
      display: flex; flex-wrap: wrap; gap: 14px;
    }

    /* 返回链接 */
    .back-link {
      background: none; border: none; border-radius: 0; padding: 0;
      font-size: 13px; color: var(--text-muted); margin-bottom: 26px;
    }
    .back-link:hover { color: var(--text-primary); }

    /* 文章正文：去掉卡片，纯文本流 */
    .article {
      background: none; border: none; border-radius: 0; padding: 0;
    }
    .article-title {
      font-size: 27px; line-height: 1.4; letter-spacing: 0;
      margin: 0 0 12px; font-weight: 700;
    }
    .article-meta {
      font-size: 13px; color: var(--text-muted);
      padding-bottom: 22px; margin-bottom: 30px;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    }
    .article-meta a { margin-left: auto; font-size: 12px; }
    .article-body { font-size: 16px; line-height: 1.9; }
    .article-body h1 { font-size: 22px; margin: 2em 0 .7em; }
    .article-body h2 { font-size: 19px; margin: 2em 0 .7em; }
    .article-body h3 { font-size: 17px; margin: 1.8em 0 .6em; }
    .article-body p { margin-bottom: 1.25em; }
    .article-body blockquote {
      border-left: 2px solid var(--border-strong);
      padding: 2px 0 2px 16px; margin: 1.6em 0;
      color: var(--text-secondary); font-size: 15px;
    }
    .article-body img { border-radius: 0; margin: 1.8em 0; }

    /* 目录：轻量边框盒 */
    /* 注意：全局 nav 是 flex 胶囊样式，目录同是 <nav>，需显式复位 */
    .article-toc {
      display: block; align-items: initial; gap: 0;
      background: none; border: 1px solid var(--border); border-radius: 0;
      padding: 18px 20px; margin: 0 0 34px;
    }
    .article-toc-title { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; letter-spacing: .1em; }
    .article-toc ol { display: block; }
    .article-toc li { line-height: 1.95; font-size: 14px; }
    .article-toc a {
      color: var(--text-secondary); font-size: 14px;
      padding: 0; border-radius: 0; font-weight: 400; background: none;
    }
    .article-toc a:hover { background: none; text-decoration: underline; }
    .article-toc a:hover { color: var(--text-primary); }

    @media (max-width: 560px) {
      .issue-head { flex-direction: column; gap: 3px; }
      .issue-date { order: -1; }
      .article-title { font-size: 23px; }
    }
  </style>
</head>
<body>

    <div class="header-inner">

      <nav>

  <div class="mobile-nav" id="mobileNav">

  </div>

  <main>
    <div class="page-header" id="pageHeader">
      <h1>写作</h1>
      <p>更长形式的思考与文章</p>
    </div>

    <!-- 列表视图 -->
    <div class="list-view" id="listView">
      <div class="wr-toolbar">
        <div class="filter-tabs" id="labelTabs"></div>
        <div class="wr-actions">
          <select id="sortFilter" class="wr-select" title="排序方式">
            <option value="newest">最新优先</option>
            <option value="oldest">最早优先</option>
            <option value="updated">最近更新</option>
          </select>
          <a class="wr-write" href="https://github.com/daheitian/seesquotes/issues/new" target="_blank" rel="noopener" title="在 GitHub 新建一篇文章">写一篇</a>
        </div>

      <div id="content">
        <div class="loading">
          <div class="loading-spinner"></div>

        </div>
      </div>
    </div>

    <!-- 文章阅读视图 -->
    <div class="article-view" id="articleView">
      <button class="back-link" id="backBtn">← 返回文章列表</button>
      <div id="articleContent">
        <div class="loading">
          <div class="loading-spinner"></div>

        </div>
      </div>

  <footer>
    <p>小信号 · <a href="https://github.com/daheitian/seesquotes" target="_blank" rel="noopener">GitHub</a> · 由 Notion 与微信读书驱动 · <a href="./rss.xml">RSS 订阅</a></p>
  </footer>

  <script src="./assets/js/main.js"></script>
  <script src="./assets/js/markdown.js"></script>
  <script>
    const { escapeHtml, formatDate } = window.siteUtils;
    const REPO = 'daheitian/seesquotes';
    const API = `https://api.github.com/repos/${REPO}`;

    let allIssues = [];
    let currentLabel = '';
    let currentSort = 'newest';
    const content = document.getElementById('content');
    const listView = document.getElementById('listView');
    const articleView = document.getElementById('articleView');
    const pageHeader = document.getElementById('pageHeader');

    /* ================= 列表视图 ================= */

    function excerpt(body) {
      if (!body) return '';
      return body
        .replace(/```[\s\S]*?```/g, '')
        .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
        .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
        .replace(/[#>*`~_\-\[\]]/g, '')
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, 120);
    }

    async function loadIssues() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        const response = await fetch(`${API}/issues?state=all&per_page=100`, {
          signal: controller.signal,
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        clearTimeout(timeoutId);
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        allIssues = (await response.json()).filter(issue => !issue.pull_request);
        populateLabelFilter();
        renderIssues();
      } catch (error) {
        let errorMsg = error.message;
        if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) errorMsg = '跨域请求被阻止（CORS）';
        else if (error.name === 'AbortError') errorMsg = '请求超时';
        content.innerHTML = `
          <div class="error">
            <div class="error-icon">⚠️</div>
            <h3>加载失败</h3>
            <p>${escapeHtml(errorMsg)}</p>
            <button class="btn-primary" onclick="loadIssues()">重试</button>
          </div>`;
      }
    }

    // 标签筛选：扁平 chip（排除同步用的内部标签 notion-blog），带文章数
    function populateLabelFilter() {
      const counts = new Map();
      allIssues.forEach(issue => (issue.labels || []).forEach(label => {
        if (label.name === 'notion-blog') return;
        counts.set(label.name, (counts.get(label.name) || 0) + 1);
      }));
      const labels = [...counts.entries()].sort((a, b) =>
        b[1] - a[1] || a[0].localeCompare(b[0], 'zh')
      );
      const chip = (val, text, count, active) =>
        `<button class="filter-tab${active ? ' active' : ''}" data-label="${escapeHtml(val)}">${escapeHtml(text)}` +
        (count != null ? `<span style="opacity:.5;margin-left:5px;">${count}</span>` : '') + `</button>`;

      document.getElementById('labelTabs').innerHTML =
        chip('', '全部', allIssues.length, currentLabel === '') +
        labels.map(([name, n]) => chip(name, name, n, currentLabel === name)).join('');
    }

    function renderIssues() {
      let issues = allIssues;
      if (currentLabel) issues = issues.filter(i => (i.labels || []).some(l => l.name === currentLabel));

      issues.sort((a, b) => {
        if (currentSort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
        if (currentSort === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
        if (currentSort === 'updated') return new Date(b.updated_at) - new Date(a.updated_at);
      });

      if (issues.length === 0) {
        content.innerHTML = `
          <div class="empty">
            <div class="empty-icon">📝</div>
            <p>暂无文章</p>
            <p style="font-size:13px;margin-top:8px;"><a href="https://github.com/${REPO}/issues/new" target="_blank" rel="noopener">创建第一篇 →</a></p>
          </div>`;
        return;
      }

      content.innerHTML = `<div class="issues-list">${issues.map(issue => {
        const date = new Date(issue.created_at);
        const dateStr = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
        const labels = (issue.labels || []).map(l =>
          `<span class="issue-label" style="${l.color ? `background:#${l.color}22;color:#${l.color};` : ''}">${escapeHtml(l.name)}</span>`
        ).join('');
        const ex = excerpt(issue.body);
        const ymd = `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
        const cats = (issue.labels || []).filter(l => l.name !== 'notion-blog').map(l => l.name);

        return `<a class="issue-item" href="#post-${issue.number}">
          <div class="issue-head">
            <span class="issue-title">${escapeHtml(issue.title)}</span>
            <time class="issue-date">${ymd}</time>
          </div>
          ${ex ? `<p class="issue-excerpt">${escapeHtml(ex)}…</p>` : ''}
          <div class="issue-meta">
            <span>${readingTime(issue.body)}</span>
            ${cats.length ? `<span>${escapeHtml(cats.join(' · '))}</span>` : ''}
            ${issue.comments ? `<span>💬 ${issue.comments}</span>` : ''}
          </div>
        </a>`;
      }).join('')}</div>`;
    }

    /* ================= 文章视图（站内阅读） ================= */

    // 阅读时长估算（中文约 400 字/分钟）
    function readingTime(text) {
      const chars = (text || '').replace(/\s/g, '').length;
      return `约 ${Math.max(1, Math.round(chars / 400))} 分钟`;
    }

    // 从正文标题生成编号目录（用 data-target + 平滑滚动，避免污染 #post- 路由）
    function buildToc(box) {
      const body = box.querySelector('.article-body');
      if (!body) return;
      const heads = [...body.querySelectorAll('h1, h2, h3')];
      if (heads.length < 2) return;
      const items = heads.map((h, i) => {
        const id = `section-${i + 1}`;
        h.id = id;
        return `<li><a href="#" data-target="${id}">${escapeHtml(h.textContent.trim())}</a></li>`;
      }).join('');
      const nav = document.createElement('nav');
      nav.className = 'article-toc';
      nav.innerHTML = `<div class="article-toc-title">目录</div><ol>${items}</ol>`;
      nav.addEventListener('click', (e) => {
        const a = e.target.closest('a[data-target]');
        if (!a) return;
        e.preventDefault();
        const el = document.getElementById(a.dataset.target);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      body.parentNode.insertBefore(nav, body);
    }

    async function openArticle(number) {
      listView.classList.add('hidden');
      articleView.classList.add('active');
      pageHeader.style.display = 'none';
      window.scrollTo(0, 0);

      const box = document.getElementById('articleContent');
      box.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>加载文章…</p></div>';

      try {
        const [issueRes, commentsRes] = await Promise.all([
          fetch(`${API}/issues/${number}`, { headers: { 'Accept': 'application/vnd.github.v3+json' } }),
          fetch(`${API}/issues/${number}/comments?per_page=100`, { headers: { 'Accept': 'application/vnd.github.v3+json' } })
        ]);
        if (!issueRes.ok) throw new Error(`HTTP ${issueRes.status}`);
        const issue = await issueRes.json();
        const comments = commentsRes.ok ? await commentsRes.json() : [];

        const date = new Date(issue.created_at);
        const labels = (issue.labels || [])
          .filter(l => l.name !== 'notion-blog')
          .map(l => `<span>${escapeHtml(l.name)}</span>`)
          .join('');

        const commentsHtml = comments.length ? `
          <div class="comments-section">
            <div class="comments-title">留言 · ${comments.length}</div>
            ${comments.map(c => `
              <div class="comment-item">
                <img class="comment-avatar" src="${escapeHtml(c.user.avatar_url)}" alt="" loading="lazy">
                <div class="comment-body">
                  <span class="comment-author">${escapeHtml(c.user.login)}</span>
                  <span class="comment-time">${formatDate(c.created_at)}</span>
                  <div class="comment-content">${renderMarkdown(c.body)}</div>
                </div>
              </div>`).join('')}
          </div>` : '';

        box.innerHTML = `
          <article class="article">
            <h1 class="article-title">${escapeHtml(issue.title)}</h1>
            <div class="article-meta">
              <span>${formatDate(issue.created_at)}</span>
              <span>${readingTime(issue.body)}</span>
              ${issue.comments ? `<span>💬 ${issue.comments}</span>` : ''}
              ${labels}
              <a href="${escapeHtml(issue.html_url)}" target="_blank" rel="noopener" style="margin-left:auto;font-size:12px;">在 GitHub 编辑 →</a>
            </div>
            <div class="article-body">${renderMarkdown(issue.body) || '<p style="color:var(--text-muted);">（正文为空）</p>'}</div>
            ${commentsHtml}
          </article>`;
        buildToc(box);
        window.scrollTo(0, 0);
      } catch (error) {
        box.innerHTML = `
          <div class="error">
            <div class="error-icon">⚠️</div>
            <h3>加载失败</h3>
            <p>${escapeHtml(error.message)}</p>
          </div>`;
      }
    }

    function showList() {
      articleView.classList.remove('active');
      listView.classList.remove('hidden');
      pageHeader.style.display = '';
    }

    /* ================= 路由 ================= */

    function route() {
      const m = location.hash.match(/^#post-(\d+)$/);
      if (m) openArticle(+m[1]);
      else showList();
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      // 清掉 hash 但不触发 hashchange（部分浏览器清空 hash 不派发事件），直接切回列表
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      showList();
    });

    window.addEventListener('hashchange', route);

    document.getElementById('labelTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-tab');
      if (!btn) return;
      currentLabel = btn.dataset.label;
      populateLabelFilter();
      renderIssues();
    });

    document.getElementById('sortFilter').addEventListener('change', (e) => {
      currentSort = e.target.value;
      renderIssues();
    });

    loadIssues().then(route);
  </script>
</body>
</html>
