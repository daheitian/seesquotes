<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写作 | 小信号</title>
  <meta name="description" content="更长形式的思考与文章，基于 GitHub Issues">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="小信号" href="./rss.xml">
  <style>
    /* ===== 站内文章阅读视图 ===== */
    .article-view { display: none; }
    .article-view.active { display: block; }
    .list-view.hidden { display: none; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      margin-bottom: 20px;
      background: none;
      border: none;
      padding: 0;
      font-family: var(--sans);
    }
    .back-link:hover { color: var(--accent); }

    .article {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 40px 40px;
    }

    .article-title {
      font-family: var(--serif);
      font-size: 27px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    /* 编号目录（参考 doc.niallspace.com 的文章页） */
    /* 列表条目：标题用衬线，更像文章索引 */
    .issues-list .issue-title { font-family: var(--serif); font-size: 17px; line-height: 1.6; }

    .article-toc {
      margin: 26px 0 34px;
      padding: 16px 20px 18px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .article-toc-title {
      font-size: 11px;
      letter-spacing: .2em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .article-toc ol { counter-reset: toc; list-style: none; margin: 0; padding: 0; }
    .article-toc li {
      counter-increment: toc;
      font-size: 14px;
      line-height: 2;
      color: var(--text-secondary);
    }
    .article-toc li::before { content: counter(toc) ". "; color: var(--text-muted); }
    .article-toc a { color: var(--text-secondary); text-decoration: none; }
    .article-toc a:hover { color: var(--text-primary); text-decoration: underline; }
    .article-body h2, .article-body h3, .article-body h1 { scroll-margin-top: 90px; }

    .article-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
      padding-bottom: 18px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    /* Markdown 正文排版 */
    .article-body {
      font-size: 16px;
      line-height: 1.9;
      color: var(--text-primary);
      word-wrap: break-word;
    }
    .article-body h1, .article-body h2, .article-body h3,
    .article-body h4, .article-body h5, .article-body h6 {
      font-family: var(--serif);
      margin: 28px 0 12px;
      line-height: 1.5;
      color: var(--text-primary);
    }
    .article-body h1 { font-size: 22px; }
    .article-body h2 { font-size: 20px; }
    .article-body h3 { font-size: 18px; }
    .article-body h4, .article-body h5, .article-body h6 { font-size: 16px; }
    .article-body p { margin-bottom: 14px; }
    .article-body a { color: var(--accent); }
    .article-body a:hover { text-decoration: underline; }
    .article-body img {
      max-width: 100%;
      border-radius: var(--radius-sm);
      margin: 10px 0;
    }
    .article-body blockquote {
      border-left: 3px solid var(--accent);
      padding: 4px 0 4px 16px;
      margin: 16px 0;
      color: var(--text-secondary);
    }
    .article-body blockquote p { margin: 6px 0; }
    .article-body ul, .article-body ol {
      margin: 12px 0;
      padding-left: 24px;
    }
    .article-body li { margin-bottom: 6px; }
    .article-body code {
      background: var(--bg-card-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 13.5px;
      font-family: ui-monospace, Consolas, monospace;
      color: var(--accent);
    }
    .article-body pre {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      overflow-x: auto;
      margin: 16px 0;
    }
    .article-body pre code {
      background: none;
      border: none;
      padding: 0;
      color: var(--text-primary);
      font-size: 13.5px;
      line-height: 1.7;
    }
    .article-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }
    .article-body strong { color: var(--text-primary); }

    /* 评论 */
    .comments-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .comments-title {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .comment-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .comment-item:last-child { border-bottom: none; }
    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .comment-body { flex: 1; min-width: 0; }
    .comment-author {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .comment-time { font-size: 12px; color: var(--text-muted); margin-left: 8px; }
    .comment-content {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-top: 4px;
    }

    @media (max-width: 640px) {
      .article { padding: 20px; }
      .article-title { font-size: 20px; }
    }

    /* ===== 全直角覆盖（写作页统一去弧角） ===== */
    .list-view .toolbar select,
    .list-view .btn-primary,
    .list-view .issue-label,
    .article-view .toolbar select,
    .article-view .btn-primary,
    .article-view .issue-label { border-radius: 2px; }

    .article-view .article,
    .article-view .article-body pre,
    .article-view .article-body code,
    .article-view .article-body pre code,
    .article-view .comment-avatar,
    .article-view .comment-content code,
    .article-view .comment-content pre { border-radius: 2px; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="./" class="logo">小信号<span>.</span></a>
      <nav>
        <a href="./">见室引号</a>
        <a href="./archive.html">归档</a>
        <a href="./reading.html">阅览</a>
        <a href="./thoughts.html">想法</a>
        <a href="./writing.html" class="active">写作</a>
        <a href="./about.html">关于</a>
      </nav>
      <div class="controls">
        <a href="./search.html" class="btn-icon" title="搜索">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </a>
        <button class="btn-icon" id="themeBtn" title="切换主题">
          <svg id="sunIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg id="moonIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button class="menu-btn" id="menuBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <button class="mobile-nav-close" id="mobileNavClose">&times;</button>
    <a href="./">见室引号</a>
    <a href="./archive.html">归档</a>
    <a href="./reading.html">阅览</a>
        <a href="./thoughts.html">想法</a>
    <a href="./writing.html" class="active">写作</a>
    <a href="./about.html">关于</a>
  </div>

  <main>
    <div class="page-header" id="pageHeader">
      <h1>写作</h1>
      <p>更长形式的思考与文章</p>
    </div>

    <!-- 列表视图 -->
    <div class="list-view" id="listView">
      <div class="toolbar">
        <select id="labelFilter">
          <option value="">全部标签</option>
        </select>
        <select id="sortFilter">
          <option value="newest">最新优先</option>
          <option value="oldest">最早优先</option>
          <option value="updated">最近更新</option>
        </select>
        <a href="https://github.com/daheitian/seesquotes/issues/new" target="_blank" rel="noopener" class="btn-primary" style="margin-left:auto;padding:8px 18px;">✍️ 写一篇</a>
      </div>
      <div id="content">
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>加载文章…</p>
        </div>
      </div>
    </div>

    <!-- 文章阅读视图 -->
    <div class="article-view" id="articleView">
      <button class="back-link" id="backBtn">← 返回文章列表</button>
      <div id="articleContent">
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>加载文章…</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>小信号 · <a href="https://github.com/daheitian/seesquotes" target="_blank" rel="noopener">GitHub</a> · 由 Notion 与微信读书驱动 · <a href="./rss.xml">RSS 订阅</a></p>
  </footer>

  <script src="./assets/js/main.js"></script>
  <script src="./assets/js/markdown.js"></script>
  <script>
    const { escapeHtml, formatDate } = window.siteUtils;
    const REPO = 'daheitian/seesquotes';
    const API = `https://api.github.com/repos/${REPO}`;

    let allIssues = [];
    let currentLabel = '';
    let currentSort = 'newest';
    const content = document.getElementById('content');
    const listView = document.getElementById('listView');
    const articleView = document.getElementById('articleView');
    const pageHeader = document.getElementById('pageHeader');

    /* ================= 列表视图 ================= */

    function excerpt(body) {
      if (!body) return '';
      return body
        .replace(/```[\s\S]*?```/g, '')
        .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
        .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
        .replace(/[#>*`~_\-\[\]]/g, '')
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, 120);
    }

    async function loadIssues() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        const response = await fetch(`${API}/issues?state=all&per_page=100`, {
          signal: controller.signal,
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        clearTimeout(timeoutId);
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        allIssues = (await response.json()).filter(issue => !issue.pull_request);
        populateLabelFilter();
        renderIssues();
      } catch (error) {
        let errorMsg = error.message;
        if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) errorMsg = '跨域请求被阻止（CORS）';
        else if (error.name === 'AbortError') errorMsg = '请求超时';
        content.innerHTML = `
          <div class="error">
            <div class="error-icon">⚠️</div>
            <h3>加载失败</h3>
            <p>${escapeHtml(errorMsg)}</p>
            <button class="btn-primary" onclick="loadIssues()">重试</button>
          </div>`;
      }
    }

    function populateLabelFilter() {
      const labels = new Set();
      allIssues.forEach(issue => (issue.labels || []).forEach(label => labels.add(label.name)));
      const select = document.getElementById('labelFilter');
      while (select.options.length > 1) select.remove(1);
      Array.from(labels).sort().forEach(label => {
        const option = document.createElement('option');
        option.value = label;
        option.textContent = label;
        select.appendChild(option);
      });
    }

    function renderIssues() {
      let issues = allIssues;
      if (currentLabel) issues = issues.filter(i => (i.labels || []).some(l => l.name === currentLabel));

      issues.sort((a, b) => {
        if (currentSort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
        if (currentSort === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
        if (currentSort === 'updated') return new Date(b.updated_at) - new Date(a.updated_at);
      });

      if (issues.length === 0) {
        content.innerHTML = `
          <div class="empty">
            <div class="empty-icon">📝</div>
            <p>暂无文章</p>
            <p style="font-size:13px;margin-top:8px;"><a href="https://github.com/${REPO}/issues/new" target="_blank" rel="noopener">创建第一篇 →</a></p>
          </div>`;
        return;
      }

      content.innerHTML = `<div class="issues-list">${issues.map(issue => {
        const date = new Date(issue.created_at);
        const dateStr = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
        const labels = (issue.labels || []).map(l =>
          `<span class="issue-label" style="${l.color ? `background:#${l.color}22;color:#${l.color};` : ''}">${escapeHtml(l.name)}</span>`
        ).join('');
        const ex = excerpt(issue.body);

        return `<a class="issue-item" href="#post-${issue.number}">
          <div class="issue-title">${escapeHtml(issue.title)}</div>
          ${ex ? `<div class="issue-excerpt">${escapeHtml(ex)}…</div>` : ''}
          <div class="issue-meta">
            <span>${dateStr}</span>
            <span>${readingTime(issue.body)}</span>
            ${issue.comments ? `<span>💬 ${issue.comments}</span>` : ''}
            ${labels}
          </div>
        </a>`;
      }).join('')}</div>`;
    }

    /* ================= 文章视图（站内阅读） ================= */

    // 阅读时长估算（中文约 400 字/分钟）
    function readingTime(text) {
      const chars = (text || '').replace(/\s/g, '').length;
      return `约 ${Math.max(1, Math.round(chars / 400))} 分钟`;
    }

    // 从正文标题生成编号目录（用 data-target + 平滑滚动，避免污染 #post- 路由）
    function buildToc(box) {
      const body = box.querySelector('.article-body');
      if (!body) return;
      const heads = [...body.querySelectorAll('h1, h2, h3')];
      if (heads.length < 2) return;
      const items = heads.map((h, i) => {
        const id = `section-${i + 1}`;
        h.id = id;
        return `<li><a href="#" data-target="${id}">${escapeHtml(h.textContent.trim())}</a></li>`;
      }).join('');
      const nav = document.createElement('nav');
      nav.className = 'article-toc';
      nav.innerHTML = `<div class="article-toc-title">目录</div><ol>${items}</ol>`;
      nav.addEventListener('click', (e) => {
        const a = e.target.closest('a[data-target]');
        if (!a) return;
        e.preventDefault();
        const el = document.getElementById(a.dataset.target);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      body.parentNode.insertBefore(nav, body);
    }

    async function openArticle(number) {
      listView.classList.add('hidden');
      articleView.classList.add('active');
      pageHeader.style.display = 'none';
      window.scrollTo(0, 0);

      const box = document.getElementById('articleContent');
      box.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>加载文章…</p></div>';

      try {
        const [issueRes, commentsRes] = await Promise.all([
          fetch(`${API}/issues/${number}`, { headers: { 'Accept': 'application/vnd.github.v3+json' } }),
          fetch(`${API}/issues/${number}/comments?per_page=100`, { headers: { 'Accept': 'application/vnd.github.v3+json' } })
        ]);
        if (!issueRes.ok) throw new Error(`HTTP ${issueRes.status}`);
        const issue = await issueRes.json();
        const comments = commentsRes.ok ? await commentsRes.json() : [];

        const date = new Date(issue.created_at);
        const labels = (issue.labels || []).map(l =>
          `<span class="issue-label" style="${l.color ? `background:#${l.color}22;color:#${l.color};` : ''}">${escapeHtml(l.name)}</span>`
        ).join('');

        const commentsHtml = comments.length ? `
          <div class="comments-section">
            <div class="comments-title">留言 · ${comments.length}</div>
            ${comments.map(c => `
              <div class="comment-item">
                <img class="comment-avatar" src="${escapeHtml(c.user.avatar_url)}" alt="" loading="lazy">
                <div class="comment-body">
                  <span class="comment-author">${escapeHtml(c.user.login)}</span>
                  <span class="comment-time">${formatDate(c.created_at)}</span>
                  <div class="comment-content">${renderMarkdown(c.body)}</div>
                </div>
              </div>`).join('')}
          </div>` : '';

        box.innerHTML = `
          <article class="article">
            <h1 class="article-title">${escapeHtml(issue.title)}</h1>
            <div class="article-meta">
              <span>${formatDate(issue.created_at)}</span>
              <span>${readingTime(issue.body)}</span>
              ${issue.comments ? `<span>💬 ${issue.comments}</span>` : ''}
              ${labels}
              <a href="${escapeHtml(issue.html_url)}" target="_blank" rel="noopener" style="margin-left:auto;font-size:12px;">在 GitHub 编辑 →</a>
            </div>
            <div class="article-body">${renderMarkdown(issue.body) || '<p style="color:var(--text-muted);">（正文为空）</p>'}</div>
            ${commentsHtml}
          </article>`;
        buildToc(box);
        window.scrollTo(0, 0);
      } catch (error) {
        box.innerHTML = `
          <div class="error">
            <div class="error-icon">⚠️</div>
            <h3>加载失败</h3>
            <p>${escapeHtml(error.message)}</p>
          </div>`;
      }
    }

    function showList() {
      articleView.classList.remove('active');
      listView.classList.remove('hidden');
      pageHeader.style.display = '';
    }

    /* ================= 路由 ================= */

    function route() {
      const m = location.hash.match(/^#post-(\d+)$/);
      if (m) openArticle(+m[1]);
      else showList();
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      // 清掉 hash 但不触发 hashchange（部分浏览器清空 hash 不派发事件），直接切回列表
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      showList();
    });

    window.addEventListener('hashchange', route);

    document.getElementById('labelFilter').addEventListener('change', (e) => {
      currentLabel = e.target.value;
      renderIssues();
    });

    document.getElementById('sortFilter').addEventListener('change', (e) => {
      currentSort = e.target.value;
      renderIssues();
    });

    loadIssues().then(route);
  </script>
</body>
</html>
