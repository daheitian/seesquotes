</head>

          </svg>
          <svg id="moonIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button class="menu-btn" id="menuBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>

      </div>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <button class="mobile-nav-close" id="mobileNavClose">&times;</button>
    <a href="./">见室引号</a>
    <a href="./archive.html">归档</a>
    <a href="./reading.html">阅览</a>
        <a href="./thoughts.html">想法</a>
    <a href="./writing.html">写作</a>
    <a href="./about.html">关于</a>
  </div>

  <main>
    <div class="page-header">
      <h1>搜索</h1>
      <p>同时检索金句与微信读书笔记</p>
    </div>

    <div class="search-box" style="margin-bottom:24px;">
      <input type="text" id="searchInput" placeholder="输入关键词，回车或实时搜索…" autocomplete="off" autofocus>
    </div>

    <div id="results"></div>
  </main>

  <footer>
    <p>小信号 · <a href="https://github.com/daheitian/seesquotes" target="_blank" rel="noopener">GitHub</a> · 由 Notion 与微信读书驱动 · <a href="./rss.xml">RSS 订阅</a></p>
  </footer>

  <script src="./assets/js/main.js"></script>
  <script>
    const { escapeHtml, formatDate, formatTs, renderQuoteBody, sourceLink, loadJSON } = window.siteUtils;
    let quotes = [];
    let books = [];
    const results = document.getElementById('results');
    const input = document.getElementById('searchInput');

    // 关键词高亮
    function hl(text, q) {
      const safe = escapeHtml(text);
      if (!q) return safe;
      const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return safe.replace(new RegExp(`(${esc})`, 'gi'), '<mark style="background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 1px;">$1</mark>');
    }

    async function initData() {
      results.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>准备索引中…</p></div>';
      const tasks = await Promise.allSettled([
        loadJSON('./notion-data.json'),
        loadJSON('./_data/weread.json')
      ]);
      if (tasks[0].status === 'fulfilled') {
        quotes = tasks[0].value.posts || tasks[0].value;
      }
      if (tasks[1].status === 'fulfilled') {
        books = tasks[1].value.books || [];
      }
      results.innerHTML = '';
    }

    function search(q) {
      const query = q.trim().toLowerCase();
      if (!query) return { quoteHits: [], bookHits: [] };

      const quoteHits = quotes.filter(p =>
        (p.title || '').toLowerCase().includes(query) ||
        (p.content || '').toLowerCase().includes(query)
      ).slice(0, 30);

      const bookHits = [];
      for (const b of books) {
        const hitHighlights = (b.highlights || []).filter(h => (h.text || '').toLowerCase().includes(query)).slice(0, 10);
        const hitReviews = (b.reviews || []).filter(r => (r.content || '').toLowerCase().includes(query)).slice(0, 10);
        const bookMatch = (b.title || '').toLowerCase().includes(query) || (b.author || '').toLowerCase().includes(query);
        if (bookMatch || hitHighlights.length || hitReviews.length) {
          bookHits.push({
            book: b,
            highlights: bookMatch ? (b.highlights || []).slice(0, 5) : hitHighlights,
            reviews: bookMatch ? (b.reviews || []).slice(0, 5) : hitReviews,
          });
        }
        if (bookHits.length >= 10) break;
      }
      return { quoteHits, bookHits };
    }

    function render(q) {
      const { quoteHits, bookHits } = search(q);
      const query = q.trim();

      if (!query) {
        results.innerHTML = '';
        return;
      }
      if (quoteHits.length === 0 && bookHits.length === 0) {
        results.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>没有找到「${escapeHtml(query)}」相关内容</p></div>`;
        return;
      }

      let html = '';
      if (quoteHits.length) {
        html += `<p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">金句 · ${quoteHits.length} 条</p>
          <div class="posts">${quoteHits.map(p => {
            const text = p.content || p.title || '';
            const clamp = text.length > 160;
            return `<article class="post">
              ${sourceLink(p.url, 'post-src')}
              <div class="post-content${clamp ? ' clamped' : ''}">${hl(text, query)}</div>
              ${clamp ? '<button class="show-more" type="button">展开全文</button>' : ''}
              <div class="post-date">${formatDate(p.date || p.pubDate)}</div>
            </article>`;
          }).join('')}</div>`;
      }
      if (bookHits.length) {
        html += `<p style="font-size:13px;color:var(--text-muted);margin:24px 0 12px;">读书笔记 · ${bookHits.length} 本</p>
          <div class="posts">${bookHits.map(hit => {
            const b = hit.book;
            const notes = [
              ...hit.highlights.map(h => `<div class="note-item"><div class="note-chapter">${escapeHtml(h.chapter || '划线')}</div><div class="note-highlight">${hl(h.text, query)}</div></div>`),
              ...hit.reviews.map(r => `<div class="note-item"><div class="note-chapter">${escapeHtml(r.chapter || '想法')}</div><div class="note-review">${hl(r.content, query)}</div></div>`)
            ].join('');
            return `<article class="post">
              <div style="font-size:15px;font-weight:600;margin-bottom:10px;">📖 ${hl(b.title || '', query)} <span style="font-weight:400;font-size:13px;color:var(--text-muted);">${escapeHtml(b.author || '')}</span></div>
              <div class="note-list">${notes}</div>
            </article>`;
          }).join('')}</div>`;
      }
      results.innerHTML = html;
    }

    let debounceTimer;
    input.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const q = e.target.value;
      debounceTimer = setTimeout(() => render(q), 200);
    });

    initData();
  </script>
</body>
</html>
