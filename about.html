  <main>
    <div class="page-header">
      <h1>关于</h1>
      <p>关于这个空间的说明</p>
    </div>

    <div class="about-content" id="aboutContent">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>加载中…</p>
      </div>
    </div>

    <p style="text-align:center;margin-top:24px;font-size:13px;color:var(--text-muted);">
      <a href="https://github.com/daheitian/seesquotes/edit/main/content/about.md" target="_blank" rel="noopener">✏️ 在 GitHub 编辑本页</a>
    </p>
  </main>

  <footer>
    <p>小信号 · <a href="https://github.com/daheitian/seesquotes" target="_blank" rel="noopener">GitHub</a> · 由 Notion 与微信读书驱动 · <a href="./rss.xml">RSS 订阅</a></p>
  </footer>

  <script src="./assets/js/main.js"></script>
  <script src="./assets/js/markdown.js"></script>
  <script>
    (async () => {
      const box = document.getElementById('aboutContent');
      try {
        const res = await fetch('./content/about.md');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();
        box.innerHTML = '<div class="md-body">' + window.renderMarkdown(md) + '</div>';
      } catch (err) {
        box.innerHTML = `
          <div class="error">
            <div class="error-icon">⚠️</div>
            <h3>加载失败</h3>
            <p>${err.message}</p>
          </div>`;
      }
    })();
  </script>
