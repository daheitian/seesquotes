<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅览 | 小信号</title>
  <meta name="description" content="微信读书书架与划线笔记">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="./" class="logo">小信号<span>.</span></a>
      <nav>
        <a href="./">见室引号</a>
        <a href="./archive.html">归档</a>
        <a href="./reading.html" class="active">阅览</a>
        <a href="./writing.html">写作</a>
        <a href="./about.html">关于</a>
      </nav>
      <div class="controls">
        <a href="./search.html" class="btn-icon" title="搜索">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </a>
        <button class="btn-icon" id="themeBtn" title="切换主题">
          <svg id="sunIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg id="moonIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button class="menu-btn" id="menuBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <button class="mobile-nav-close" id="mobileNavClose">&times;</button>
    <a href="./">见室引号</a>
    <a href="./archive.html">归档</a>
    <a href="./reading.html" class="active">阅览</a>
    <a href="./writing.html">写作</a>
    <a href="./about.html">关于</a>
  </div>

  <main>
    <div class="page-header">
      <h1>阅览</h1>
      <p>读过的书，划过的线——同步自微信读书</p>
    </div>

    <div class="stats">
      <div class="stat-item"><div class="stat-value" id="bookCount">-</div><div class="stat-label">书</div></div>
      <div class="stat-item"><div class="stat-value" id="highlightCount">-</div><div class="stat-label">划线</div></div>
      <div class="stat-item"><div class="stat-value" id="reviewCount">-</div><div class="stat-label">想法</div></div>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" data-view="notes">读书笔记</button>
      <button class="filter-tab" data-view="shelf">书架</button>
    </div>

    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>加载中…</p>
      </div>
    </div>
  </main>

  <footer>
    <p>小信号 · <a href="https://github.com/daheitian/seesquotes" target="_blank" rel="noopener">GitHub</a> · 由 Notion 与微信读书驱动</p>
  </footer>

  <script src="./assets/js/main.js"></script>
  <script>
    const { escapeHtml, formatTs, loadJSON } = window.siteUtils;
    let data = null;          // { lastSync, books, shelf }
    let view = 'notes';
    let query = '';

    const content = document.getElementById('content');

    /* ---------- 渲染 ---------- */

    function coverHtml(cover, title) {
      if (cover) {
        return `<img class="book-cover" src="${escapeHtml(cover)}" alt="${escapeHtml(title)}"
                  onerror="this.outerHTML='<div class=&quot;book-cover-fallback&quot;>📖</div>'">`;
      }
      return `<div class="book-cover-fallback">📖</div>`;
    }

    function highlightHtml(h) {
      return `<div class="note-item">
        <div class="note-chapter">${escapeHtml(h.chapter || '')}</div>
        <div class="note-highlight">${escapeHtml(h.text)}</div>
        <div class="note-time">${formatTs(h.time)}</div>
      </div>`;
    }

    function reviewHtml(r) {
      return `<div class="note-item">
        <div class="note-chapter">${escapeHtml(r.chapter || '')}</div>
        <div class="note-review">
          ${r.abstract ? `<span class="review-quote">「${escapeHtml(r.abstract)}」</span>` : ''}
          ${escapeHtml(r.content)}
        </div>
        <div class="note-time">${formatTs(r.time)}</div>
      </div>`;
    }

    function bookHtml(book) {
      const open = book._open ? ' open' : '';
      const hCount = (book.highlights || []).length;
      const rCount = (book.reviews || []).length;
      const defaultTab = hCount > 0 ? 'highlights' : 'reviews';
      const notes = view => view === 'highlights'
        ? (book.highlights || []).map(highlightHtml).join('') || '<div class="empty" style="padding:24px;">暂无划线</div>'
        : (book.reviews || []).map(reviewHtml).join('') || '<div class="empty" style="padding:24px;">暂无想法</div>';

      const meta = [];
      if (hCount) meta.push(`${hCount} 条划线`);
      if (rCount) meta.push(`${rCount} 条想法`);
      if (book.readingTime) meta.push(`累计 ${Math.round(book.readingTime / 3600 * 10) / 10} 小时`);

      return `<div class="book-item${open}" data-bookid="${escapeHtml(book.bookId)}" data-tab="${defaultTab}">
        <div class="book-head">
          ${coverHtml(book.cover, book.title)}
          <div class="book-info">
            <div class="book-title">${escapeHtml(book.title)}</div>
            <div class="book-author">${escapeHtml(book.author || '')}</div>
            <div class="book-meta">${meta.map(m => `<span>${m}</span>`).join('')}</div>
          </div>
          <svg class="book-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </div>
        <div class="book-notes">
          <div class="note-tabs">
            <button class="note-tab${defaultTab === 'highlights' ? ' active' : ''}" data-note="highlights">划线 ${hCount || ''}</button>
            <button class="note-tab${defaultTab === 'reviews' ? ' active' : ''}" data-note="reviews">想法 ${rCount || ''}</button>
          </div>
          <div class="note-list" data-view="${defaultTab}">${notes(defaultTab)}</div>
        </div>
      </div>`;
    }

    function renderNotes() {
      let books = (data.books || []).filter(b => (b.highlights || []).length || (b.reviews || []).length);
      if (query) {
        const q = query.toLowerCase();
        books = books.filter(b =>
          (b.title || '').toLowerCase().includes(q) ||
          (b.author || '').toLowerCase().includes(q) ||
          (b.highlights || []).some(h => (h.text || '').toLowerCase().includes(q)) ||
          (b.reviews || []).some(r => (r.content || '').toLowerCase().includes(q))
        );
      }

      if (books.length === 0) {
        content.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>${query ? '没有匹配的笔记' : '还没有读书笔记'}</p></div>`;
        return;
      }

      content.innerHTML = books.map(bookHtml).join('');
    }

    function renderShelf() {
      let shelf = data.shelf || [];
      if (query) {
        const q = query.toLowerCase();
        shelf = shelf.filter(b =>
          (b.title || '').toLowerCase().includes(q) ||
          (b.author || '').toLowerCase().includes(q)
        );
      }
      if (shelf.length === 0) {
        content.innerHTML = `<div class="empty"><div class="empty-icon">📚</div><p>${query ? '没有匹配的书' : '书架还是空的'}</p></div>`;
        return;
      }

      content.innerHTML = `<div class="shelf-grid">${shelf.map(b => {
        const hours = b.readingTime ? Math.round(b.readingTime / 3600 * 10) / 10 : 0;
        return `<a class="shelf-item" href="https://weread.qq.com/web/bookDetail/${escapeHtml(b.bookId)}" target="_blank" rel="noopener" title="${hours ? `累计阅读 ${hours} 小时` : ''}">
          ${b.cover
            ? `<img src="${escapeHtml(b.cover)}" alt="${escapeHtml(b.title)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;cover-fallback&quot;>📖</div>'">`
            : `<div class="cover-fallback">📖</div>`}
          <div class="shelf-title">${escapeHtml(b.title)}</div>
        </a>`;
      }).join('')}</div>`;
    }

    function render() {
      if (view === 'notes') renderNotes(); else renderShelf();
    }

    function updateStats() {
      const books = data.books || [];
      document.getElementById('bookCount').textContent =
        new Set([...books.map(b => b.bookId), ...(data.shelf || []).map(b => b.bookId)]).size;
      document.getElementById('highlightCount').textContent =
        books.reduce((n, b) => n + (b.highlights || []).length, 0);
      document.getElementById('reviewCount').textContent =
        books.reduce((n, b) => n + (b.reviews || []).length, 0);
    }

    /* ---------- 状态：未配置 / 加载失败 ---------- */

    function showSetup() {
      content.innerHTML = `
        <div class="setup-guide">
          <h3>📖 阅览页还没有数据</h3>
          <p style="font-size:14px;color:var(--text-secondary);margin-bottom:14px;">同步微信读书需要配置一次 GitHub 仓库的 Cookie，之后每天自动更新：</p>
          <ol>
            <li>在浏览器打开 <code>weread.qq.com</code> 并扫码登录</li>
            <li>按 <code>F12</code> → Network → 找到 <code>weread.qq.com</code> 请求，复制完整的 <code>Cookie</code> 值</li>
            <li>仓库 <code>Settings → Secrets and variables → Actions</code> 新建 Secret：<code>WEREAD_COOKIE</code></li>
            <li>在 Actions 页手动运行 <code>Sync WeRead Notes</code>，之后每天自动同步</li>
          </ol>
          <p style="font-size:13px;color:var(--text-muted);">Cookie 失效后（约 30 天）同步会失败，按上面步骤重新获取即可。</p>
        </div>`;
    }

    /* ---------- 交互 ---------- */

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        view = tab.dataset.view;
        render();
      });
    });

    // 展开/收起书籍 + 划线/想法切换（事件委托）
    content.addEventListener('click', (e) => {
      const noteTab = e.target.closest('.note-tab');
      if (noteTab) {
        e.stopPropagation();
        const item = noteTab.closest('.book-item');
        item.querySelectorAll('.note-tab').forEach(t => t.classList.remove('active'));
        noteTab.classList.add('active');
        const book = findBook(item.dataset.bookid);
        const which = noteTab.dataset.note;
        item.querySelector('.note-list').innerHTML = which === 'highlights'
          ? (book.highlights || []).map(highlightHtml).join('') || '<div class="empty" style="padding:24px;">暂无划线</div>'
          : (book.reviews || []).map(reviewHtml).join('') || '<div class="empty" style="padding:24px;">暂无想法</div>';
        return;
      }
      if (e.target.closest('.note-list, a')) return;
      const head = e.target.closest('.book-head');
      if (head) head.closest('.book-item').classList.toggle('open');
    });

    function findBook(id) {
      return (data.books || []).find(b => b.bookId === id) || {};
    }

    // 全站搜索框（顶栏搜索图标进搜索页；这里提供本地过滤）
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        window.location.href = './search.html';
      }
    });

    /* ---------- 加载 ---------- */

    (async () => {
      try {
        data = await loadJSON('./_data/weread.json');
        updateStats();
        render();
      } catch (err) {
        showSetup();
      }
    })();
  </script>
</body>
</html>
