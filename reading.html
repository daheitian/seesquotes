  <meta name="description" content="读过的书、划过的线——同步自微信读书">

</head>
<body>

      <nav>

      <div class="controls">
        <a href="./search.html" class="btn-icon" title="搜索">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>

        <button class="btn-icon" id="themeBtn" title="切换主题">
          <svg id="sunIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg id="moonIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button class="menu-btn" id="menuBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
      </div>
    </div>

  <div class="mobile-nav" id="mobileNav">
    <button class="mobile-nav-close" id="mobileNavClose">&times;</button>
    <a href="./">见室引号</a>
    <a href="./archive.html">归档</a>
    <a href="./reading.html" class="active">阅览</a>
        <a href="./thoughts.html">想法</a>
    <a href="./writing.html">写作</a>
    <a href="./about.html">关于</a>
  </div>

  <main>
    <div class="page-header">
      <h1>阅览</h1>
      <p>读过的书，划过的线——同步自微信读书</p>
    </div>

    <div class="stats">
      <div class="stat-item"><div class="stat-value" id="bookCount">-</div><div class="stat-label">书</div></div>
      <div class="stat-item"><div class="stat-value" id="highlightCount">-</div><div class="stat-label">划线</div></div>
      <div class="stat-item"><div class="stat-value" id="reviewCount">-</div><div class="stat-label">想法</div></div>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" data-view="notes">读书笔记</button>
      <button class="filter-tab" data-view="shelf">书架</button>
    </div>

    <div class="toolbar" id="catToolbar" style="display:none;">
      <select id="categoryFilter">
        <option value="">全部分类</option>
      </select>
      <span style="font-size:12px;color:var(--text-muted);" id="catHint"></span>
    </div>

    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>加载中…</p>
      </div>
    </div>
  </main>

  <footer>
    <p>小信号 · <a href="https://github.com/daheitian/seesquotes" target="_blank" rel="noopener">GitHub</a> · 由 Notion 与微信读书驱动</p>
  </footer>

  <script src="./assets/js/main.js"></script>
  <script>
    const { escapeHtml, formatTs, loadJSON } = window.siteUtils;
    let data = null;
    let view = 'notes';
    let query = '';
    let category = '';
    let renderedCount = 0;
    const PAGE_SIZE = 10;

    const content = document.getElementById('content');

    /* ---------- 单本书的渲染 ---------- */

    function ratingStars(star) {
      if (!star || star < 1) return '';
      const s = Math.min(5, Math.max(1, Math.round(star)));
      return '★'.repeat(s) + '☆'.repeat(5 - s);
    }

    // 划线位置排序用："2959-3007" -> 2959
    const rangeStart = (r) => {
      const m = String(r || '').split('-')[0];
      const n = parseInt(m, 10);
      return isNaN(n) ? 0 : n;
    };

    // 把想法挂到对应划线（按 range 匹配），返回 {quotes:[{hl, comment}], standalone:[review]}
    function assembleNotes(book) {
      const highlights = [...(book.highlights || [])].sort((a, b) =>
        rangeStart(a.range) - rangeStart(b.range)
      );
      const commentByRange = new Map();
      const standalone = [];

      for (const r of book.reviews || []) {
        if (r.abstract && r.range) {
          commentByRange.set(r.range, r);
        } else {
          standalone.push(r);
        }
      }

      const quotes = highlights.map((hl) => ({
        hl,
        comment: commentByRange.get(hl.range) || null,
      }));

      // 有 abstract 但没匹配到划线的想法，也作为独立引用块
      for (const [range, r] of commentByRange) {
        if (!highlights.some((h) => h.range === range)) {
          quotes.push({ hl: { text: r.abstract, chapter: r.chapter, range, time: r.time }, comment: r });
        }
      }
      quotes.sort((a, b) => rangeStart(a.hl.range) - rangeStart(b.hl.range));

      return { quotes, standalone };
    }

    function quoteHtml(q) {
      const comment = q.comment
        ? `<div class="quote-comment">${escapeHtml(q.comment.content)}</div>`
        : '';
      return `<div class="quote-block">
        <div class="note-chapter">${escapeHtml(q.hl.chapter || '')}</div>
        <blockquote>${escapeHtml(q.hl.text)}</blockquote>
        ${comment}
      </div>`;
    }

    function bookEntryHtml(book) {
      const { quotes, standalone } = assembleNotes(book);
      const bookReviews = standalone.filter((r) => !r.chapter);        // 整本书评
      const chapterReviews = standalone.filter((r) => r.chapter);      // 章节点评

      const lastTime = Math.max(
        0,
        ...(book.highlights || []).map((h) => h.time || 0),
        ...(book.reviews || []).map((r) => r.time || 0)
      );

      const rating = (book.reviews || []).find((r) => r.star >= 1)?.star;
      const status = book.markedStatus === 1 ? '读完' : '在读';

      // 清理微信读书书名里的营销副标题括号
      const title = escapeHtml((book.title || '未命名')
        .replace(/[（(][^）)]{15,}[）)]/g, '')
        .replace(/\s+/g, ' ')
        .trim() || book.title || '未命名');

      const metaBits = [];
      if (book.author) metaBits.push(`<span>${escapeHtml(book.author)}</span>`);
      metaBits.push('<span class="divider">·</span>');
      metaBits.push(`<span>${status}</span>`);
      if (book.readingProgress > 0 && book.markedStatus !== 1) {
        metaBits.push(`<span class="book-progress">${Math.round(book.readingProgress)}%</span>`);
      }
      if (rating) metaBits.push(`<span class="book-rating">${ratingStars(rating)}</span>`);

      // 划线较多时折叠后面的
      const QUOTE_LIMIT = 6;
      const quotesHtml = quotes.map((q, i) =>
        `<div class="${i >= QUOTE_LIMIT ? 'quote-hidden' : ''}">${quoteHtml(q)}</div>`
      ).join('');

      const chapterReviewsHtml = chapterReviews.map((r) =>
        `<div class="book-comment"><div class="note-chapter">${escapeHtml(r.chapter)}</div>${escapeHtml(r.content)}</div>`
      ).join('');

      // title 已在上方定义

      return `<article class="book-entry" id="book-${escapeHtml(book.bookId)}" data-bookid="${escapeHtml(book.bookId)}">
        <div class="book-entry-head">
          ${book.deepLink
            ? `<a class="book-entry-title" href="${escapeHtml(book.deepLink)}" target="_blank" rel="noopener" title="在微信读书打开">《${title}》</a>`
            : `<h2 class="book-entry-title">《${title}》</h2>`}
          <div class="book-entry-meta">${metaBits.join('')}</div>
        </div>
        ${bookReviews.map((r) => {
          const stars = ratingStars(r.star);
          return `<div class="book-comment">${escapeHtml(r.content)}</div>${stars ? `<div class="book-rating">${stars}</div>` : ''}`;
        }).join('')}
        ${chapterReviewsHtml}
        ${quotes.length ? `<div class="book-quotes">${quotesHtml}</div>` : ''}
        ${quotes.length > QUOTE_LIMIT ? '<button class="continue-btn" type="button">继续阅读 →</button>' : ''}
        <div class="book-entry-date">${lastTime ? formatTs(lastTime) : ''}</div>
      </article>`;
    }

    /* ---------- 视图渲染 ---------- */

    function renderNotes(append = false) {
      let books = data.books || [];
      if (category) {
        books = category === '__none__'
          ? books.filter((b) => !b.category)
          : books.filter((b) => b.category === category);
      }
      if (query) {
        const q = query.toLowerCase();
        books = books.filter((b) =>
          (b.title || '').toLowerCase().includes(q) ||
          (b.author || '').toLowerCase().includes(q) ||
          (b.highlights || []).some((h) => (h.text || '').toLowerCase().includes(q)) ||
          (b.reviews || []).some((r) => (r.content || '').toLowerCase().includes(q))
        );
      }

      if (books.length === 0) {
        content.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>${query ? '没有匹配的笔记' : '还没有读书笔记'}</p></div>`;
        return;
      }

      if (append) renderedCount = Math.min(renderedCount + PAGE_SIZE, books.length);
      else renderedCount = Math.min(PAGE_SIZE, books.length);

      // 每次整体重渲染已展示部分，避免增量插入的状态不同步
      const shown = books.slice(0, renderedCount);
      const html = shown.map(bookEntryHtml).join('');
      const moreHtml = renderedCount < books.length
        ? `<button class="btn-primary" id="moreBtn" style="background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);">加载更多（已显示 ${renderedCount} / ${books.length} 本）</button>`
        : `<p style="font-size:13px;color:var(--text-muted);">已显示全部 ${books.length} 本</p>`;

      content.innerHTML = `<div class="book-feed" id="bookFeed">${html}</div>
        <div class="load-more" style="text-align:center;padding:24px 0 0;">${moreHtml}</div>`;
      document.getElementById('moreBtn')?.addEventListener('click', () => renderNotes(true));
    }

    function renderShelf() {
      let shelf = data.shelf || [];
      if (category) {
        shelf = category === '__none__'
          ? shelf.filter((b) => !b.category)
          : shelf.filter((b) => b.category === category);
      }
      if (query) {
        const q = query.toLowerCase();
        shelf = shelf.filter((b) =>
          (b.title || '').toLowerCase().includes(q) ||
          (b.author || '').toLowerCase().includes(q)
        );
      }
      if (shelf.length === 0) {
        content.innerHTML = `<div class="empty"><div class="empty-icon">📚</div><p>${query || category ? '没有匹配的书' : '书架还是空的'}</p></div>`;
        return;
      }

      const notesIds = new Set((data.books || []).map((b) => b.bookId));
      content.innerHTML = `<div class="shelf-grid">${shelf.map((b) => {
        const label = escapeHtml(b.title || '');
        const hasNotes = notesIds.has(b.bookId);
        // 有笔记的书：点击进入站内笔记；没有的：跳微信读书
        const open = hasNotes
          ? `<span class="shelf-item" data-jump="${escapeHtml(b.bookId)}" title="查看我的笔记" style="cursor:pointer;">`
          : b.deepLink
            ? `<a class="shelf-item" href="${escapeHtml(b.deepLink)}" target="_blank" rel="noopener" title="在微信读书打开">`
            : '<span class="shelf-item">';
        const close = (hasNotes || !b.deepLink) ? '</span>' : '</a>';
        return `${open}
          ${b.cover
            ? `<img src="${escapeHtml(b.cover)}" alt="${label}" loading="lazy" onerror="this.outerHTML='<div class=&quot;cover-fallback&quot;>📖</div>'">`
            : `<div class="cover-fallback">📖</div>`}
          <div class="shelf-title">${label}${b.finished ? ' ✅' : ''}</div>
        ${close}`;
      }).join('')}</div>`;
    }

    function render(append = false) {
      if (view === 'notes') renderNotes(append); else renderShelf();
    }

    function updateStats() {
      const books = data.books || [];
      document.getElementById('bookCount').textContent = (data.shelf || []).length || books.length;
      document.getElementById('highlightCount').textContent =
        books.reduce((n, b) => n + (b.highlights || []).length, 0);
      document.getElementById('reviewCount').textContent =
        books.reduce((n, b) => n + (b.reviews || []).length, 0);
    }

    /* ---------- 交互 ---------- */

    document.querySelectorAll('.filter-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        view = tab.dataset.view;
        renderedCount = 0;
        render();
      });
    });

    // 分类筛选
    function populateCategories() {
      const cats = [...new Set([
        ...(data.books || []).map((b) => b.category),
        ...(data.shelf || []).map((b) => b.category),
      ].filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh'));
      const select = document.getElementById('categoryFilter');
      cats.forEach((c) => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
      if (cats.length) {
        const none = document.createElement('option');
        none.value = '__none__';
        none.textContent = '未分类';
        select.appendChild(none);
        document.getElementById('catToolbar').style.display = 'flex';
        document.getElementById('catHint').textContent = `${cats.length} 个分类`;
      }
    }

    document.getElementById('categoryFilter').addEventListener('change', (e) => {
      category = e.target.value;
      renderedCount = 0;
      render();
    });

    // 书架 → 站内笔记跳转
    function jumpToNotes(bookId, tries = 0) {
      // 注意：getElementById 按字面匹配，不要用 CSS.escape（数字开头 id 会被转义坏）
      const entry = document.getElementById(`book-${bookId}`);
      if (entry) {
        entry.classList.add('expanded');
        entry.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      // 目标还在未渲染的分页里，继续加载直到找到
      const moreBtn = document.getElementById('moreBtn');
      if (moreBtn && tries < 200) {
        moreBtn.click();
        setTimeout(() => jumpToNotes(bookId, tries + 1), 60);
      }
    }

    content.addEventListener('click', (e) => {
      const jump = e.target.closest('[data-jump]');
      if (jump) {
        const bookId = jump.dataset.jump;
        document.querySelector(".filter-tab[data-view='notes']")?.click();
        setTimeout(() => jumpToNotes(bookId), 50);
        return;
      }
      if (e.target.classList.contains('continue-btn')) {
        e.target.closest('.book-entry').classList.add('expanded');
        e.target.remove();
      }
    });

    /* ---------- 加载 ---------- */

    (async () => {
      try {
        data = await loadJSON('./_data/weread.json');
        updateStats();
        populateCategories();
        render();
      } catch (err) {
        content.innerHTML = `
          <div class="setup-guide">
            <h3>📖 阅览页还没有数据</h3>
            <p style="font-size:14px;color:var(--text-secondary);margin-bottom:14px;">同步微信读书只需一次配置，之后每天自动更新：</p>
            <ol>
              <li>前往 <code>https://weread.qq.com/r/weread-skills</code> 获取你的 API Key（<code>wrk-</code> 开头）</li>
              <li>仓库 <code>Settings → Secrets and variables → Actions</code> 新建 Secret：<code>WEREAD_API_KEY</code></li>
              <li>在 Actions 页手动运行 <code>Sync WeRead Notes</code>，之后每天自动同步</li>
            </ol>
            <p style="font-size:13px;color:var(--text-muted);">使用微信读书官方 Agent API，无需 Cookie，不会过期。</p>
          </div>`;
      }
    })();
  </script>
</body>
