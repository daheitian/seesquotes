<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅览 | 小信号</title>
  <meta name="description" content="读过的书、划过的线——同步自微信读书">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="小信号" href="./rss.xml">
  <style>
    /* ---------- 阅览页：书封网格 + 侧栏（时间线/单书笔记，可开关） ---------- */
    .rd-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; }
    .rd-layout.side-off { grid-template-columns: minmax(0, 1fr); }
    .rd-layout.side-off .rd-side { display: none; }
    .rd-tgl {
      font-size: 12px; padding: 8px 13px; background: transparent; border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer; border-radius: 0; white-space: nowrap;
    }
    .rd-tgl.active { color: var(--text-primary); border-color: var(--text-secondary); }
    .rd-cover.active { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* 单书划线：弹出层 */
    .rd-modal { position: fixed; inset: 0; z-index: 100; display: none; }
    .rd-modal.open { display: block; }
    .rd-modal-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .62); }
    .rd-modal-box {
      position: relative; margin: 6vh auto 0; width: min(760px, calc(100% - 32px));
      max-height: 86vh; display: flex; flex-direction: column;
      background: var(--bg-secondary); border: 1px solid var(--border);
    }
    .rd-modal-head {
      display: flex; align-items: center; gap: 12px; padding: 18px 22px 14px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .rd-modal-title { font-family: var(--serif); font-size: 19px; font-weight: 700; color: var(--text-primary); line-height: 1.45; }
    .rd-modal-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .rd-modal-close {
      margin-left: auto; background: none; border: 1px solid var(--border); color: var(--text-secondary);
      cursor: pointer; font-size: 17px; line-height: 1; padding: 5px 11px; flex-shrink: 0;
    }
    .rd-modal-close:hover { color: var(--text-primary); border-color: var(--text-secondary); }
    .rd-modal-body { padding: 20px 22px 26px; overflow-y: auto; overscroll-behavior: contain; }
    .rd-modal-body .book-entry { border: none; padding: 0; }
    .rd-modal-body .book-entry-title { font-size: 18px; }
    .rd-modal-body .book-entry-head { margin-bottom: 14px; }
    body.modal-open { overflow: hidden; }
    .rd-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .rd-toolbar input[type="search"] {
      flex: 1; min-width: 180px; padding: 8px 14px; font-size: 14px;
      background: transparent; border: none; border-bottom: 1px solid var(--border);
      color: var(--text-primary); outline: none; border-radius: 0;
    }
    .rd-toolbar input[type="search"]:focus { border-bottom-color: var(--text-secondary); }
    .rd-toolbar select {
      padding: 8px 10px; font-size: 13px; background: transparent;
      border: 1px solid var(--border); color: var(--text-secondary); border-radius: 0; outline: none;
    }
    .rd-stats { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; letter-spacing: .02em; }
    .rd-stats b { color: var(--text-secondary); font-weight: 600; }
    .rd-stats .sep { margin: 0 8px; opacity: .5; }

    /* 书封网格 */
    .rd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px 12px; }
    .rd-cover { position: relative; cursor: pointer; aspect-ratio: 2 / 3; overflow: hidden; background: var(--bg-card); }
    .rd-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease; }
    .rd-cover:hover img { transform: scale(1.04); }
    .rd-cover .cover-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .rd-cover-overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end;
      padding: 10px 8px; background: linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.45) 55%, transparent 100%);
      opacity: 0; transition: opacity .2s ease; pointer-events: none;
    }
    .rd-cover:hover .rd-cover-overlay { opacity: 1; }
    .rd-cover-overlay b { color: #fff; font-size: 12px; font-weight: 600; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .rd-cover-overlay span { color: rgba(255,255,255,.72); font-size: 11px; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rd-cover-overlay i { color: rgba(255,255,255,.55); font-size: 10px; font-style: normal; margin-top: 4px; }
    .rd-cover-badge {
      position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.62); color: rgba(255,255,255,.85); font-size: 10px; border-radius: 9px;
    }
    .rd-grid-empty { color: var(--text-muted); font-size: 14px; padding: 40px 0; text-align: center; }

    /* 单本书详情 */
    .rd-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary);
      background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 18px; }
    .rd-back:hover { color: var(--text-primary); }

    /* 右栏时间线 */
    .rd-side { position: sticky; top: 76px; }
    .rd-side-panel {
      max-height: calc(100vh - 120px); overflow-y: auto; overscroll-behavior: contain;
      border: 1px solid var(--border); padding: 18px 16px 14px;
    }
    .rd-side-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
    .rd-side-title { font-size: 12px; font-weight: 700; letter-spacing: .18em; color: var(--text-primary); }
    .rd-side-count { font-size: 11px; color: var(--text-muted); }
    .rd-side-chips { display: flex; gap: 6px; margin: 10px 0 6px; }
    .rd-chip {
      font-size: 11px; padding: 3px 10px; cursor: pointer; background: transparent;
      border: 1px solid var(--border); color: var(--text-muted); border-radius: 0;
    }
    .rd-chip.active { color: var(--text-primary); border-color: var(--text-secondary); }
    .rd-tl-date { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 18px 0 4px; }
    .rd-tl-item { position: relative; padding: 8px 0 10px 16px; border-left: 1px solid var(--border); }
    .rd-tl-item::before {
      content: ""; position: absolute; left: -3.5px; top: 14px; width: 6px; height: 6px;
      border-radius: 50%; background: var(--accent); opacity: .75;
    }
    .rd-tl-meta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .rd-tl-time { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .rd-tl-book { font-size: 12px; color: var(--text-secondary); text-decoration: none; cursor: pointer;
      max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rd-tl-book:hover { color: var(--text-primary); }
    .rd-tl-tag { font-size: 10px; padding: 1px 6px; border: 1px solid var(--border); color: var(--text-muted); }
    .rd-tl-text { font-size: 13px; line-height: 1.7; color: var(--text-primary); margin-top: 4px;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .rd-tl-chap { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .rd-tl-more { display: block; width: 100%; margin-top: 14px; padding: 7px 0; font-size: 12px;
      background: none; border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; }
    .rd-tl-more:hover { color: var(--text-primary); border-color: var(--text-secondary); }
    .rd-tl-empty { font-size: 13px; color: var(--text-muted); padding: 20px 0; text-align: center; }

    @media (max-width: 960px) {
      .rd-layout { grid-template-columns: 1fr; gap: 36px; }
      .rd-side { position: static; }
      .rd-side-panel { max-height: 480px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="./" class="logo">小信号<span>.</span></a>
      <nav>
        <a href="./">见室引号</a>
        <a href="./archive.html">归档</a>
        <a href="./reading.html" class="active">阅览</a>
        <a href="./thoughts.html">想法</a>
        <a href="./writing.html">写作</a>
        <a href="./about.html">关于</a>
      </nav>
      <div class="controls">
        <a href="./search.html" class="btn-icon" title="搜索">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </a>
        <button class="btn-icon" id="themeBtn" title="切换主题">
          <svg id="sunIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg id="moonIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button class="menu-btn" id="menuBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <button class="mobile-nav-close" id="mobileNavClose">&times;</button>
    <a href="./">见室引号</a>
    <a href="./archive.html">归档</a>
    <a href="./reading.html" class="active">阅览</a>
    <a href="./thoughts.html">想法</a>
    <a href="./writing.html">写作</a>
    <a href="./about.html">关于</a>
  </div>

  <main>
    <div class="page-header">
      <h1>阅览</h1>
      <p>读过的书，划过的线——同步自微信读书</p>
    </div>

    <div class="rd-layout">
      <section class="rd-main">
        <div class="rd-toolbar">
          <input type="search" id="rdSearch" placeholder="搜索书名、作者或划线内容" autocomplete="off">
          <select id="categoryFilter"><option value="">全部分类</option></select>
          <select id="statusFilter">
            <option value="">全部状态</option>
            <option value="read">读完</option>
            <option value="reading">在读</option>
          </select>
          <button class="rd-tgl active" id="sideToggle" title="显示 / 隐藏右侧面板">时间线</button>
        </div>
        <div class="rd-stats" id="rdStats"></div>
        <div id="content">
          <div class="loading">
            <div class="loading-spinner"></div>
            <p>加载中…</p>
          </div>
        </div>
      </section>

      <aside class="rd-side">
        <div class="rd-side-panel">
          <div class="rd-panel-head">
            <span class="rd-panel-title">TIMELINE</span>
            <span class="rd-side-count" id="tlCount" style="margin-left:auto;"></span>
          </div>
          <div class="rd-side-chips" id="tlChips">
            <button class="rd-chip active" data-type="">全部</button>
            <button class="rd-chip" data-type="hl">划线</button>
            <button class="rd-chip" data-type="rv">想法</button>
          </div>
          <div class="rd-panel-body">
            <div id="timeline"><div class="rd-tl-empty">加载中…</div></div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- 单书划线：弹出层 -->
  <div class="rd-modal" id="bookModal" role="dialog" aria-modal="true">
    <div class="rd-modal-backdrop" id="modalBackdrop"></div>
    <div class="rd-modal-box">
      <div class="rd-modal-head">
        <div>
          <div class="rd-modal-title" id="modalTitle"></div>
          <div class="rd-modal-sub" id="modalSub"></div>
        </div>
        <button class="rd-modal-close" id="modalClose" title="关闭（Esc）">×</button>
      </div>
      <div class="rd-modal-body" id="modalBody"></div>
    </div>
  </div>

  <footer>
    <p>小信号 · <a href="https://github.com/daheitian/seesquotes" target="_blank" rel="noopener">GitHub</a> · 由 Notion 与微信读书驱动 · <a href="./rss.xml">RSS 订阅</a></p>
  </footer>

  <script src="./assets/js/main.js"></script>
  <script>
    const { escapeHtml, formatTs, loadJSON } = window.siteUtils;
    let data = null;
    let merged = [];          // 书架 + 笔记合并后的全部书
    let notesFlat = [];       // 全部划线/想法平铺（时间线用）
    let query = '', category = '', status = '', tlType = '';
    let currentBook = null;   // 详情模式的书
    let tlRendered = 0;
    const TL_PAGE = 60;

    const content = document.getElementById('content');
    const timelineEl = document.getElementById('timeline');

    /* ---------- 数据准备 ---------- */

    function prepare() {
      const books = data.books || [];
      const byId = new Map();
      for (const b of data.shelf || []) byId.set(b.bookId, { ...b });
      for (const b of books) byId.set(b.bookId, { ...(byId.get(b.bookId) || {}), ...b, _hasNotes: true });
      merged = [...byId.values()].sort((a, b) => (b._sort || 0) - (a._sort || 0));

      notesFlat = [];
      for (const b of books) {
        for (const h of b.highlights || []) {
          if (!h.text) continue;
          notesFlat.push({ t: h.time || 0, type: 'hl', text: h.text, chapter: h.chapter, book: b });
        }
        for (const r of b.reviews || []) {
          if (!r.content) continue;
          notesFlat.push({ t: r.time || 0, type: 'rv', text: r.content, chapter: r.chapter, book: b });
        }
      }
      notesFlat.sort((a, b2) => (b2.t || 0) - (a.t || 0));
    }

    function matchBook(b) {
      if (category) {
        if (category === '__none__' ? !!b.category : b.category !== category) return false;
      }
      if (status === 'read' && b.markedStatus !== 1) return false;
      if (status === 'reading' && b.markedStatus === 1) return false;
      if (query) {
        const q = query.toLowerCase();
        return (b.title || '').toLowerCase().includes(q) ||
               (b.author || '').toLowerCase().includes(q) ||
               (b.highlights || []).some((h) => (h.text || '').toLowerCase().includes(q)) ||
               (b.reviews || []).some((r) => (r.content || '').toLowerCase().includes(q));
      }
      return true;
    }

    /* ---------- 左栏：书封网格 / 单书详情 ---------- */

    function cleanTitle(t) {
      return (t || '未命名').replace(/[（(][^）)]{15,}[）)]/g, '').replace(/\s+/g, ' ').trim() || t || '未命名';
    }

    function renderGrid() {
      const books = merged.filter(matchBook);
      if (!books.length) {
        content.innerHTML = `<div class="rd-grid-empty">${query || category || status ? '没有匹配的书' : '书架还是空的'}</div>`;
        return;
      }
      const grid = `<div class="rd-grid">${books.map((b) => {
        const n = (b._noteCount || (b.highlights || []).length + (b.reviews || []).length);
        const open = b._hasNotes
          ? `<div class="rd-cover" data-open="${escapeHtml(b.bookId)}" title="查看我的笔记">`
          : b.deepLink
            ? `<a class="rd-cover" href="${escapeHtml(b.deepLink)}" target="_blank" rel="noopener" title="在微信读书打开">`
            : `<div class="rd-cover">`;
        const close = b._hasNotes || !b.deepLink ? '</div>' : '</a>';
        return `${open}
          ${b.cover
            ? `<img src="${escapeHtml(b.cover)}" alt="${escapeHtml(cleanTitle(b.title))}" loading="lazy" onerror="this.style.display='none'">`
            : `<div class="cover-fallback">📖</div>`}
          ${b._hasNotes && n ? `<span class="rd-cover-badge">${n}</span>` : ''}
          <div class="rd-cover-overlay">
            <b>${escapeHtml(cleanTitle(b.title))}</b>
            ${b.author ? `<span>${escapeHtml(b.author)}</span>` : ''}
            ${b._hasNotes ? `<i>${(b.highlights || []).length} 划线 · ${(b.reviews || []).length} 想法</i>` : ''}
          </div>
        ${close}`;
      }).join('')}</div>`;
      content.innerHTML = grid;
    }

    /* ---------- 单书详情（复用原笔记排版） ---------- */

    function ratingStars(star) {
      if (!star || star < 1) return '';
      const s = Math.min(5, Math.max(1, Math.round(star)));
      return '★'.repeat(s) + '☆'.repeat(5 - s);
    }
    const rangeStart = (r) => { const n = parseInt(String(r || '').split('-')[0], 10); return isNaN(n) ? 0 : n; };

    function assembleNotes(book) {
      const highlights = [...(book.highlights || [])].sort((a, b) => rangeStart(a.range) - rangeStart(b.range));
      const commentByRange = new Map();
      const standalone = [];
      for (const r of book.reviews || []) {
        if (r.abstract && r.range) commentByRange.set(r.range, r);
        else standalone.push(r);
      }
      const quotes = highlights.map((hl) => ({ hl, comment: commentByRange.get(hl.range) || null }));
      for (const [range, r] of commentByRange) {
        if (!highlights.some((h) => h.range === range)) {
          quotes.push({ hl: { text: r.abstract, chapter: r.chapter, range, time: r.time }, comment: r });
        }
      }
      quotes.sort((a, b) => rangeStart(a.hl.range) - rangeStart(b.hl.range));
      return { quotes, standalone };
    }

    function quoteHtml(q) {
      const comment = q.comment ? `<div class="quote-comment">${escapeHtml(q.comment.content)}</div>` : '';
      return `<div class="quote-block">
        <div class="note-chapter">${escapeHtml(q.hl.chapter || '')}</div>
        <blockquote>${escapeHtml(q.hl.text)}</blockquote>
        ${comment}
      </div>`;
    }

    function bookEntryHtml(book) {
      const { quotes, standalone } = assembleNotes(book);
      const bookReviews = standalone.filter((r) => !r.chapter);
      const chapterReviews = standalone.filter((r) => r.chapter);
      const lastTime = Math.max(0, ...(book.highlights || []).map((h) => h.time || 0), ...(book.reviews || []).map((r) => r.time || 0));
      const rating = (book.reviews || []).find((r) => r.star >= 1)?.star;
      const status = book.markedStatus === 1 ? '读完' : '在读';
      const title = escapeHtml(cleanTitle(book.title));

      const metaBits = [];
      if (book.author) metaBits.push(`<span>${escapeHtml(book.author)}</span>`);
      metaBits.push('<span class="divider">·</span>');
      metaBits.push(`<span>${status}</span>`);
      if (book.readingProgress > 0 && book.markedStatus !== 1) {
        metaBits.push(`<span class="book-progress">${Math.round(book.readingProgress)}%</span>`);
      }
      if (rating) metaBits.push(`<span class="book-rating">${ratingStars(rating)}</span>`);

      const QUOTE_LIMIT = 6;
      const quotesHtml = quotes.map((q, i) =>
        `<div class="${i >= QUOTE_LIMIT ? 'quote-hidden' : ''}">${quoteHtml(q)}</div>`).join('');
      const chapterReviewsHtml = chapterReviews.map((r) =>
        `<div class="book-comment"><div class="note-chapter">${escapeHtml(r.chapter)}</div>${escapeHtml(r.content)}</div>`).join('');

      return `<article class="book-entry" id="book-${escapeHtml(book.bookId)}">
        <div class="book-entry-head">
          ${book.deepLink
            ? `<a class="book-entry-title" href="${escapeHtml(book.deepLink)}" target="_blank" rel="noopener" title="在微信读书打开">《${title}》</a>`
            : `<h2 class="book-entry-title">《${title}》</h2>`}
          <div class="book-entry-meta">${metaBits.join('')}</div>
        </div>
        ${bookReviews.map((r) => {
          const stars = ratingStars(r.star);
          return `<div class="book-comment">${escapeHtml(r.content)}</div>${stars ? `<div class="book-rating">${stars}</div>` : ''}`;
        }).join('')}
        ${chapterReviewsHtml}
        ${quotes.length ? `<div class="book-quotes">${quotesHtml}</div>` : ''}
        ${quotes.length > QUOTE_LIMIT ? '<button class="continue-btn" type="button">继续阅读 →</button>' : ''}
        <div class="book-entry-date">${lastTime ? formatTs(lastTime) : ''}</div>
      </article>`;
    }

    /* 单书划线：以弹出层打开（点封面 / 时间线书名） */
    const layout = document.querySelector('.rd-layout');
    const sideToggle = document.getElementById('sideToggle');
    const modal = document.getElementById('bookModal');
    const modalBox = modal.querySelector('.rd-modal-box');
    const modalBody = document.getElementById('modalBody');
    const modalTitle = document.getElementById('modalTitle');
    const modalSub = document.getElementById('modalSub');

    function openBook(bookId) {
      const book = merged.find((b) => String(b.bookId) === String(bookId));
      if (!book || !book._hasNotes) return;
      currentBook = book;

      const hl = (book.highlights || []).length;
      const rv = (book.reviews || []).length;
      modalTitle.textContent = `《${cleanTitle(book.title)}》`;
      modalSub.textContent = [
        book.author || '',
        book.markedStatus === 1 ? '读完' : '在读',
        `${hl} 划线`,
        rv ? `${rv} 想法` : '',
      ].filter(Boolean).join(' · ');

      modalBody.innerHTML = bookEntryHtml(book);
      modalBody.scrollTop = 0;
      modalBody.querySelector('.continue-btn')?.addEventListener('click', (e) => {
        e.target.closest('.book-entry').classList.add('expanded');
        e.target.remove();
      });
      // 弹窗内不重复显示标题头部（外面已有书名）
      const head = modalBody.querySelector('.book-entry-head');
      if (head) head.style.display = 'none';

      modal.classList.add('open');
      document.body.classList.add('modal-open');

      document.querySelectorAll('.rd-cover.active').forEach((el) => el.classList.remove('active'));
      content.querySelector(`.rd-cover[data-open="${bookId}"]`)?.classList.add('active');
    }

    function closeBook() {
      if (!currentBook) return;
      currentBook = null;
      modal.classList.remove('open');
      document.body.classList.remove('modal-open');
      modalBody.innerHTML = '';
      document.querySelectorAll('.rd-cover.active').forEach((el) => el.classList.remove('active'));
    }

    document.getElementById('modalClose').addEventListener('click', closeBook);
    document.getElementById('modalBackdrop').addEventListener('click', closeBook);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBook(); });

    // 侧栏开关（记忆选择）
    function showSide(on) {
      layout.classList.toggle('side-off', !on);
      sideToggle.classList.toggle('active', on);
      try { localStorage.setItem('rd-side', on ? 'on' : 'off'); } catch (e) { /* ignore */ }
    }
    sideToggle.addEventListener('click', () => showSide(layout.classList.contains('side-off')));

    /* ---------- 右栏：时间线 ---------- */

    const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
    function dateHeader(ts) {
      const d = new Date(ts * 1000);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const that = new Date(d); that.setHours(0, 0, 0, 0);
      const diff = Math.round((today - that) / 86400000);
      const rel = diff === 0 ? ' · 今天' : diff === 1 ? ' · 昨天' : '';
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · 周${WEEK[d.getDay()]}${rel}`;
    }
    function hhmm(ts) {
      const d = new Date(ts * 1000);
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function timelineData() {
      const ids = new Set(merged.filter(matchBook).map((b) => String(b.bookId)));
      return notesFlat.filter((n) => ids.has(String(n.book.bookId)) && (!tlType || n.type === tlType));
    }

    function renderTimeline(reset = true) {
      const items = timelineData();
      document.getElementById('tlCount').textContent = `${items.length} 条`;
      if (reset) tlRendered = 0;
      tlRendered = Math.min(tlRendered + TL_PAGE, items.length);

      if (!items.length) {
        timelineEl.innerHTML = `<div class="rd-tl-empty">${query || tlType ? '没有匹配的笔记' : '还没有笔记'}</div>`;
        return;
      }

      const shown = items.slice(0, tlRendered);
      let html = '', lastDay = '';
      for (const n of shown) {
        const day = formatTs(n.t);
        if (day !== lastDay) {
          html += `<div class="rd-tl-date">${dateHeader(n.t)}</div>`;
          lastDay = day;
        }
        html += `<div class="rd-tl-item">
          <div class="rd-tl-meta">
            <span class="rd-tl-time">${hhmm(n.t)}</span>
            <span class="rd-tl-book" data-open="${escapeHtml(n.book.bookId)}" title="${escapeHtml(cleanTitle(n.book.title))}">《${escapeHtml(cleanTitle(n.book.title))}》</span>
            <span class="rd-tl-tag">${n.type === 'hl' ? '划线' : '想法'}</span>
          </div>
          <p class="rd-tl-text">${escapeHtml(n.text)}</p>
          ${n.chapter ? `<div class="rd-tl-chap">${escapeHtml(n.chapter)}</div>` : ''}
        </div>`;
      }
      const more = tlRendered < items.length
        ? `<button class="rd-tl-more" id="tlMore">加载更多（${tlRendered} / ${items.length}）</button>` : '';
      timelineEl.innerHTML = html + more;
      document.getElementById('tlMore')?.addEventListener('click', () => renderTimeline(false));
    }

    /* ---------- 统计行 ---------- */

    function renderStats() {
      const books = data.books || [];
      const hl = books.reduce((n, b) => n + (b.highlights || []).length, 0);
      const rv = books.reduce((n, b) => n + (b.reviews || []).length, 0);
      let sync = '';
      const ls = data.lastSync;
      if (typeof ls === 'number' && ls > 0) sync = formatTs(ls);
      else if (typeof ls === 'string' && ls) sync = ls.slice(0, 10);
      document.getElementById('rdStats').innerHTML =
        `<b>${(data.shelf || []).length || merged.length}</b> 本书<span class="sep">·</span>` +
        `<b>${hl}</b> 划线<span class="sep">·</span>` +
        `<b>${rv}</b> 想法` +
        (sync ? `<span class="sep">·</span>同步于 ${escapeHtml(sync)}` : '');
    }

    /* ---------- 交互 ---------- */

    let searchTimer = null;
    document.getElementById('rdSearch').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        query = e.target.value.trim();
        renderGrid();
        renderTimeline();
      }, 250);
    });
    document.getElementById('categoryFilter').addEventListener('change', (e) => {
      category = e.target.value;
      renderGrid();
      renderTimeline();
    });
    document.getElementById('statusFilter').addEventListener('change', (e) => {
      status = e.target.value;
      renderGrid();
      renderTimeline();
    });
    document.querySelectorAll('.rd-chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.rd-chip').forEach((c) => c.classList.remove('active'));
        chip.classList.add('active');
        tlType = chip.dataset.type;
        renderTimeline();
      });
    });

    // 封面 / 时间线书名 点击 → 打开单书详情（事件委托）
    document.querySelector('.rd-layout').addEventListener('click', (e) => {
      const t = e.target.closest('[data-open]');
      if (t) { e.preventDefault(); openBook(t.dataset.open); }
    });

    function populateCategories() {
      const cats = [...new Set(merged.map((b) => b.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh'));
      const select = document.getElementById('categoryFilter');
      cats.forEach((c) => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        select.appendChild(opt);
      });
      if (cats.length) {
        const none = document.createElement('option');
        none.value = '__none__'; none.textContent = '未分类';
        select.appendChild(none);
      }
    }

    /* ---------- 加载 ---------- */

    (async () => {
      try {
        data = await loadJSON('./_data/weread.json');
        prepare();
        renderStats();
        populateCategories();
        // 恢复上次的侧栏显示偏好
        let pref = 'on';
        try { pref = localStorage.getItem('rd-side') || 'on'; } catch (e) { /* ignore */ }
        showSide(pref === 'on');
        renderGrid();
        renderTimeline();
      } catch (err) {
        content.innerHTML = `
          <div class="setup-guide">
            <h3>📖 阅览页还没有数据</h3>
            <p style="font-size:14px;color:var(--text-secondary);margin-bottom:14px;">同步微信读书只需一次配置，之后每天自动更新：</p>
            <ol>
              <li>前往 <code>https://weread.qq.com/r/weread-skills</code> 获取你的 API Key（<code>wrk-</code> 开头）</li>
              <li>仓库 <code>Settings → Secrets and variables → Actions</code> 新建 Secret：<code>WEREAD_API_KEY</code></li>
              <li>在 Actions 页手动运行 <code>Sync WeRead Notes</code>，之后每天自动同步</li>
            </ol>
            <p style="font-size:13px;color:var(--text-muted);">使用微信读书官方 Agent API，无需 Cookie，不会过期。</p>
          </div>`;
        timelineEl.innerHTML = `<div class="rd-tl-empty">暂无数据</div>`;
      }
    })();
  </script>
</body>
</html>
