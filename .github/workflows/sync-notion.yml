name: Sync Notion Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Notion（金句 + 稍后读）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          READLATER_DATABASE_ID: ${{ secrets.READLATER_DATABASE_ID }}
        run: node scripts/sync-notion.mjs

      - name: Sync posts.im（想法）
        run: node scripts/sync-posts.mjs

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add notion-data.json _data/ || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "sync: $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
