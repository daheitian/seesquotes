<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>归档 | 小信号</title>
  <meta name="description" content="稍后读清单与全部金句的时间线归档">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="小信号" href="./rss.xml">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="./" class="logo">小信号<span>.</span></a>
      <nav>
        <a href="./">见室引号</a>
        <a href="./archive.html" class="active">归档</a>
        <a href="./reading.html">阅览</a>
        <a href="./thoughts.html">想法</a>
        <a href="./writing.html">写作</a>
        <a href="./about.html">关于</a>
      </nav>
      <div class="controls">
        <a href="./search.html" class="btn-icon" title="搜索">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </a>
        <button class="btn-icon" id="themeBtn" title="切换主题">
          <svg id="sunIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg id="moonIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button class="menu-btn" id="menuBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <button class="mobile-nav-close" id="mobileNavClose">&times;</button>
    <a href="./">见室引号</a>
    <a href="./archive.html" class="active">归档</a>
    <a href="./reading.html">阅览</a>
    <a href="./thoughts.html">想法</a>
    <a href="./writing.html">写作</a>
    <a href="./about.html">关于</a>
  </div>

  <main>
    <div class="page-header">
      <h1>归档</h1>
      <p>想读还没读的清单，按时间倒序</p>
    </div>

    <div class="toolbar" style="justify-content:space-between;">
      <span style="font-size:13px;color:var(--text-muted);" id="archiveCount"></span>
      <div class="search-box" style="flex:1;max-width:320px;margin-bottom:0;">
        <input type="text" id="archiveSearch" placeholder="筛选…" autocomplete="off">
      </div>
    </div>

    <div id="timeline">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>加载中…</p>
      </div>
    </div>
  </main>

  <footer>
    <p>小信号 · <a href="https://github.com/daheitian/seesquotes" target="_blank" rel="noopener">GitHub</a> · 由 Notion 与微信读书驱动 · <a href="./rss.xml">RSS 订阅</a></p>
  </footer>

  <script src="./assets/js/main.js"></script>
  <script>
    const { escapeHtml, formatDate, renderQuoteBody, needsClamp, loadJSON, hostname } = window.siteUtils;
    let readlater = null;
    let query = '';

    const timeline = document.getElementById('timeline');
    const countEl = document.getElementById('archiveCount');

    function entryHtml(item) {
      const text = item.title || '';
      const url = item.url || '';
      const tags = [...(item.tags || []), ...(item.tag ? [item.tag] : [])];
      const clamp = needsClamp(text);
      const tagHtml = tags.length
        ? `<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">${tags.map((t) =>
            `<span style="padding:2px 8px;background:var(--accent-soft);border-radius:2px;font-size:11px;color:var(--accent);">${escapeHtml(t)}</span>`
          ).join('')}</div>`
        : '';
      return `<article class="entry">
        ${url ? `<a class="entry-src" href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(hostname(url))}</a>` : ''}
        <div class="entry-body${clamp ? ' clamped' : ''}">${renderQuoteBody(text)}</div>
        ${clamp ? '<button class="show-more" type="button">展开全文</button>' : ''}
        ${tagHtml}
        <div class="entry-meta">${formatDate(item.date || item.pubDate)}${url ? ' · <a href="' + escapeHtml(url) + '" target="_blank" rel="noopener" style="color:var(--text-muted);">查看原文</a>' : ''}</div>
      </article>`;
    }

    function render() {
      const items = (readlater?.items || []).filter((i) => {
        if (!query.trim()) return true;
        return (i.title || '').toLowerCase().includes(query.trim().toLowerCase());
      });
      const total = readlater?.items?.length || 0;
      countEl.textContent = items.length === total ? `共 ${total} 条` : `${items.length} / ${total} 条`;

      if (items.length === 0) {
        timeline.innerHTML = `<div class="empty">${query ? '没有匹配的内容' : '还没有内容'}</div>`;
        return;
      }
      timeline.innerHTML = `<div class="timeline">${items.map(entryHtml).join('')}</div>`;
    }

    document.getElementById('archiveSearch').addEventListener('input', (e) => {
      query = e.target.value;
      render();
    });

    (async () => {
      try {
        readlater = await loadJSON('./_data/readlater.json');
        render();
      } catch (err) {
        timeline.innerHTML = `
          <div class="setup-guide">
            <h3>🔖 稍后读还没有数据</h3>
            <p style="font-size:14px;color:var(--text-secondary);margin-bottom:14px;">需要把你的稍后读 Notion 数据库接入同步：</p>
            <ol>
              <li>确保稍后读数据库已<strong>连接你的 Notion Integration</strong>（数据库右上角 ··· → Connections）</li>
              <li>仓库 <code>Settings → Secrets and variables → Actions</code> 新建 Secret：<code>READLATER_DATABASE_ID</code></li>
              <li>Actions 手动运行 <code>Sync Notion Data</code></li>
            </ol>
          </div>`;
      }
    })();
</script>
</body>
</html>
