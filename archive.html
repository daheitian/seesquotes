<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>归档 | 小信号</title>
  <meta name="description" content="全部文章按年份排列的归档目录">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="小信号" href="./rss.xml">
  <style>
    main { max-width: 640px; padding-top: 34px; }

    .page-header { text-align: left; padding: 14px 0 26px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    .page-header h1 { font-size: 23px; letter-spacing: 2px; margin-bottom: 7px; }
    .page-header p { margin: 0; max-width: none; font-size: 13px; color: var(--text-muted); }

    .ar-year { margin-top: 30px; }
    .ar-year-head {
      display: flex; align-items: baseline; gap: 10px;
      padding-bottom: 10px; margin-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .ar-year-head h2 {
      font-family: var(--serif); font-size: 20px; font-weight: 700;
      color: var(--text-primary); margin: 0; letter-spacing: .04em;
    }
    .ar-year-head span { font-size: 12px; color: var(--text-muted); }

    .ar-list { list-style: none; margin: 0; padding: 0; }
    .ar-list li { border-bottom: 1px solid var(--border); }
    .ar-list li:last-child { border-bottom: none; }
    .ar-list a {
      display: block; padding: 12px 0;
      font-size: 15px; line-height: 1.6; color: var(--text-primary);
      text-decoration: none; transition: color .15s ease;
    }
    .ar-list a:hover { color: var(--accent); }

    .ar-empty { font-size: 13px; color: var(--text-muted); padding: 14px 0; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="./" class="logo">小信号<span>.</span></a>
      <nav>
        <a href="./">主页</a>
        <a href="./writing.html">写作</a>
        <a href="./thoughts.html">想法</a>
        <a href="./reading.html">阅览</a>
        <a href="./quotes.html">见室引号</a>
        <a href="./archive.html" class="active">归档</a>
        <a href="./about.html">关于</a>
      </nav>
      <div class="controls">
        <a href="./search.html" class="btn-icon" title="搜索">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </a>
        <button class="btn-icon" id="themeBtn" title="切换主题">
          <svg id="sunIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg id="moonIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button class="menu-btn" id="menuBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <button class="mobile-nav-close" id="mobileNavClose">&times;</button>
    <a href="./">主页</a>
    <a href="./writing.html">写作</a>
    <a href="./thoughts.html">想法</a>
    <a href="./reading.html">阅览</a>
    <a href="./quotes.html">见室引号</a>
    <a href="./archive.html" class="active">归档</a>
    <a href="./about.html">关于</a>
  </div>

  <main>
    <div class="page-header">
      <h1>归档</h1>
      <p>全部文章，按年份排列 · 只列标题</p>
    </div>

    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>加载中…</p>
      </div>
    </div>
  </main>

  <footer>
    <p>小信号 · <a href="https://github.com/daheitian/seesquotes" target="_blank" rel="noopener">GitHub</a> · 由 Notion 与微信读书驱动 · <a href="./rss.xml">RSS 订阅</a></p>
  </footer>

  <script src="./assets/js/main.js"></script>
  <script>
    const { escapeHtml } = window.siteUtils;
    const REPO = 'daheitian/seesquotes';
    const content = document.getElementById('content');

    function render(issues) {
      if (!issues.length) {
        content.innerHTML = '<p class="ar-empty">还没有文章。<a href="./writing.html">去写作页看看 →</a></p>';
        return;
      }

      // 按年份分组，年份倒序；同年按时间倒序
      const groups = new Map();
      issues.forEach((i) => {
        const y = new Date(i.created_at).getFullYear();
        if (!groups.has(y)) groups.set(y, []);
        groups.get(y).push(i);
      });
      const years = [...groups.keys()].sort((a, b) => b - a);

      content.innerHTML = years.map((y) => {
        const list = groups.get(y).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        return `
          <section class="ar-year">
            <div class="ar-year-head">
              <h2>${y}</h2>
              <span>${list.length} 篇</span>
            </div>
            <ul class="ar-list">
              ${list.map((i) => `<li><a href="./writing.html#post-${i.number}">${escapeHtml(i.title)}</a></li>`).join('')}
            </ul>
          </section>`;
      }).join('');
    }

    async function load() {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 10000);
        const res = await fetch(`https://api.github.com/repos/${REPO}/issues?state=all&per_page=100`, {
          signal: controller.signal,
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        clearTimeout(timer);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        render((await res.json()).filter((i) => !i.pull_request));
      } catch (e) {
        content.innerHTML = `
          <div class="error">
            <div class="error-icon">⚠️</div>
            <h3>加载失败</h3>
            <p>${escapeHtml(e.message)}</p>
            <button class="btn-primary" onclick="load()">重试</button>
          </div>`;
      }
    }

    load();
  </script>
</body>
</html>
