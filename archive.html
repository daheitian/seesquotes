<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>归档 | 小信号</title>
  <meta name="description" content="全部金句与思考的时间线归档">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="./" class="logo">小信号<span>.</span></a>
      <nav>
        <a href="./">见室引号</a>
        <a href="./archive.html" class="active">归档</a>
        <a href="./reading.html">阅览</a>
        <a href="./writing.html">写作</a>
        <a href="./about.html">关于</a>
      </nav>
      <div class="controls">
        <a href="./search.html" class="btn-icon" title="搜索">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </a>
        <button class="btn-icon" id="themeBtn" title="切换主题">
          <svg id="sunIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg id="moonIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button class="menu-btn" id="menuBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <button class="mobile-nav-close" id="mobileNavClose">&times;</button>
    <a href="./">见室引号</a>
    <a href="./archive.html" class="active">归档</a>
    <a href="./reading.html">阅览</a>
    <a href="./writing.html">写作</a>
    <a href="./about.html">关于</a>
  </div>

  <main>
    <div class="page-header">
      <h1>归档</h1>
      <p>全部金句与思考，按时间倒序</p>
    </div>

    <div class="toolbar" style="justify-content:space-between;">
      <span style="font-size:13px;color:var(--text-muted);" id="archiveCount"></span>
      <div class="search-box" style="flex:1;max-width:320px;margin-bottom:0;">
        <input type="text" id="archiveSearch" placeholder="筛选金句…" autocomplete="off">
      </div>
    </div>

    <div id="timeline">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>加载中…</p>
      </div>
    </div>
  </main>

  <footer>
    <p>小信号 · <a href="https://github.com/daheitian/seesquotes" target="_blank" rel="noopener">GitHub</a> · 由 Notion 与微信读书驱动</p>
  </footer>

  <script src="./assets/js/main.js"></script>
  <script>
    const { escapeHtml, formatDate, renderQuoteBody, needsClamp, sourceLink, loadJSON } = window.siteUtils;
    let allPosts = [];

    function entryHtml(post) {
      const text = post.content || post.title || '';
      const clamp = needsClamp(text);
      return `<article class="entry" data-text="${escapeHtml(text.toLowerCase())}">
        ${sourceLink(post.url, 'entry-src')}
        <div class="entry-body${clamp ? ' clamped' : ''}">${renderQuoteBody(text)}</div>
        ${clamp ? '<button class="show-more" type="button">展开全文</button>' : ''}
        <div class="entry-meta">${formatDate(post.date || post.pubDate)}</div>
      </article>`;
    }

    function render(posts) {
      const timeline = document.getElementById('timeline');
      document.getElementById('archiveCount').textContent =
        posts.length === allPosts.length ? `共 ${allPosts.length} 条` : `${posts.length} / ${allPosts.length} 条`;
      if (posts.length === 0) {
        timeline.innerHTML = '<div class="empty">没有匹配的内容</div>';
        return;
      }
      timeline.innerHTML = `<div class="timeline">${posts.map(entryHtml).join('')}</div>`;
    }

    (async () => {
      try {
        const data = await loadJSON('./notion-data.json');
        allPosts = data.posts || data;
        render(allPosts);
      } catch (err) {
        document.getElementById('timeline').innerHTML = `
          <div class="error">
            <div class="error-icon">⚠️</div>
            <h3>加载失败</h3>
            <p>${escapeHtml(err.message)}</p>
          </div>`;
      }
    })();

    document.getElementById('archiveSearch').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) return render(allPosts);
      render(allPosts.filter(p => (p.title || p.content || '').toLowerCase().includes(q)));
    });
  </script>
</body>
</html>
